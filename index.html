<style>
:root{--bg:#121214;--sf:#1e1e22;--sf2:#2a2a30;--tx:#f2eefc;--mu:#9d98b0;--ac:#b13df5;--ac2:#4b2bc4;--lv:#e2d9fa;--bd:#33333b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2fd;--sf:#fff;--sf2:#ece5fa;--tx:#1b1528;--mu:#6c6482;--bd:#d9cff0}}
:root[data-theme="light"]{--bg:#f6f2fd;--sf:#fff;--sf2:#ece5fa;--tx:#1b1528;--mu:#6c6482;--bd:#d9cff0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--bg);
  border-bottom:1px solid var(--bd);
  padding:10px 14px;
  display:grid;
  grid-template-columns:max-content minmax(0,1fr) auto auto;
  grid-template-areas:
    "logo search acc theme"
    "nav nav nav nav";
  gap:8px 10px;
  align-items:center;
}

.logo{
  grid-area:logo;
  font:700 26px Fredoka,sans-serif;
  color:var(--ac2);
  display:flex;
  align-items:center;
  letter-spacing:1px;
}

.logo svg{width:30px;height:28px;margin:0 1px}

#q{
  grid-area:search;
  width:100%;
  min-width:0;
}

#acc{grid-area:acc;display:flex;align-items:center;gap:8px;position:relative;justify-self:end}
#acc .almora-header-avatar{width:38px;height:38px;display:grid;place-items:center;padding:0;border-radius:50%;overflow:hidden;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);font-size:17px}
#acc .almora-header-avatar img{width:100%;height:100%;object-fit:cover}
#acc .almora-header-gear{width:38px;height:38px;padding:0;border-radius:50%;font-size:19px;line-height:1}
#acc .almora-account-menu{position:absolute;right:0;top:calc(100% + 9px);z-index:20;width:min(245px,calc(100vw - 28px));padding:8px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 32px #0005;display:grid;gap:3px}
#acc .almora-account-menu[hidden]{display:none}
#acc .almora-account-menu a,#acc .almora-account-menu button{display:flex;align-items:center;width:100%;padding:10px 12px;border-radius:9px;background:transparent;color:var(--tx);text-align:left;font-weight:600;border:0}
#acc .almora-account-menu a:hover,#acc .almora-account-menu button:hover{background:var(--sf2)}
#acc .almora-menu-email{padding:8px 12px 10px;color:var(--mu);font-size:12px;overflow-wrap:anywhere;border-bottom:1px solid var(--bd);margin-bottom:4px}
#th{grid-area:theme}

nav{
  grid-area:nav;
  display:flex;
  gap:4px;
  overflow-x:auto;
  width:100%;
  min-width:0;
  padding-bottom:3px;
  white-space:nowrap;
  scrollbar-width:thin;
  flex:none;
}

nav a{
  padding:6px 12px;
  border-radius:99px;
  color:var(--mu);
  white-space:nowrap;
  font-weight:600;
  flex-shrink:0;
}

nav a.on{background:var(--ac2);color:#fff}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer;background:var(--ac2);border:0;color:#fff;font-weight:600}
button.g{background:var(--sf2);color:var(--tx)}button.d{background:#a3243b}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:22px 0 10px;border-left:4px solid var(--ac);padding-left:10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:block;min-width:130px}.row .card{width:130px}
.cv{aspect-ratio:2/3;border-radius:12px;background:var(--sf2) center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.cv b{font:700 40px Fredoka;color:#fff;text-shadow:0 2px 6px #000;padding:0 6px}
.cv i{position:absolute;top:6px;right:6px;background:#000a;color:#fff;font-style:normal;font-size:12px;padding:2px 7px;border-radius:99px}
.t{margin:6px 0 2px;font-weight:600;font-size:14px;line-height:1.2}
.ch{display:flex;justify-content:space-between;background:var(--sf);border-radius:8px;padding:6px 9px;margin-top:4px;font-size:13px}
.ch span{color:var(--mu)}.new{color:#ff4d6d;font-size:11px;font-weight:700}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.box label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}
.box input,.box select,.box textarea{width:100%}
.hero{display:flex;gap:16px;flex-wrap:wrap}.hero .cv{width:170px}.hero>div:last-child{flex:1;min-width:230px}
.pill{display:inline-block;background:var(--sf2);border-radius:99px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stars span{font-size:24px;cursor:pointer;color:var(--bd)}.stars .on{color:#f5b73d}
.rd{max-width:var(--w,720px);margin:0 auto}.rd img{display:block;width:100%;min-height:200px;background:var(--sf)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:8px 0}
.th{display:flex;gap:8px;align-items:center;margin:6px 0}.th img{width:40px;height:56px;object-fit:cover;border-radius:6px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.sep{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:12px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs button.on{background:var(--ac2);color:#fff}
.lnk{background:none;border:0;color:var(--ac);padding:4px 0;text-decoration:underline;font-weight:400}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac2);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
footer{text-align:center;color:var(--mu);padding:30px 14px;font-size:13px}

.almora-achievements{margin:22px 0}
.almora-achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.almora-achievement{display:flex;align-items:center;gap:12px;padding:12px;background:var(--sf);border:1px solid var(--bd);border-radius:13px;min-width:0}
.almora-achievement.is-locked{opacity:.58;filter:saturate(.45)}
.almora-achievement-icon{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;background:var(--sf2);border-radius:12px;font-size:25px}
.almora-achievement-copy{min-width:0;flex:1}
.almora-achievement-copy strong{display:block;line-height:1.25}
.almora-achievement-copy p{margin:4px 0;color:var(--mu);font-size:13px}
.almora-achievement-copy small{color:var(--mu);font-size:11px}
.almora-achievement-state{font-size:17px;flex:0 0 auto}
.almora-catalog-filters{align-items:stretch}
.almora-catalog-filters select{min-width:145px;max-width:100%;flex:1}
.almora-tag{background:color-mix(in srgb,var(--ac) 18%,var(--sf2));color:var(--tx)}
</style>

<body>
<header>
<a class="logo" href="#home" aria-label="ALMORA">Alm<svg viewBox="0 0 100 92"><path d="M8 8l32 14c14-5 26-5 40 0l12-14 4 40c-2 20-14 34-34 40-24-3-40-18-46-38z" fill="#050508" transform="translate(-2 0)"/><path d="M50 36l4 9h10l-8 6 3 10-9-6-9 6 3-10-8-6h10z" fill="#e2d9fa" transform="translate(-6 -2) scale(.9)"/><path d="M62 38c10-5 18-3 20 0-4 12-12 18-20 16z" fill="#b13df5"/></svg>ra</a>

<input id="q" placeholder="Pesquisar…" style="flex:1;min-width:120px">

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={works:[],prog:{},lib:{},fav:{},rate:{},bookmarks:{},pin:null},unlocked=false,draft=[];
try{Object.assign(S,JSON.parse(localStorage.getItem('almora')||'{}'))}catch(e){}

const save=()=>{
  try{
    const personalData={
      prog:S.prog||{},
      lib:S.lib||{},
      fav:S.fav||{},
      rate:S.rate||{},
      bookmarks:S.bookmarks||{}
    };
    localStorage.setItem('almora',JSON.stringify(personalData));
    return true;
  }catch(e){
    toast('Não foi possível salvar seus dados pessoais.');
    return false;
  }
};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const W=id=>S.works.find(w=>w.id===id);
const last=w=>w.chapters.length?Math.max(...w.chapters.map(c=>c.date)):w.created;
const ago=d=>{const h=(Date.now()-d)/36e5;return h<1?'agora':h<24?Math.floor(h)+' h atrás':h<48?'1 dia atrás':h<720?Math.floor(h/24)+' dias atrás':new Date(d).toLocaleDateString('pt-BR')};
const cover=w=>w.cover?`style="background-image:url(${w.cover})"`:'';
const card=(w,extra='',rank)=>`<a class="card" href="#obra/${w.id}"><div class="cv" ${cover(w)}>${rank?`<b>${rank}</b>`:''}${w.reads?`<i>👁 ${w.reads}</i>`:''}</div><div class="t">${esc(w.title)}</div>${extra}</a>`;
const sec=(t,ws,fn)=>`<h2>${t}</h2>`+(ws.length?fn(ws):`<div class="empty">Nenhuma obra ainda.</div>`);
const rowOf=ws=>`<div class="row">${ws.map((w,i)=>card(w,'',i+1)).join('')}</div>`;
const gridOf=ws=>`<div class="grid">${ws.map(w=>card(w)).join('')}</div>`;
function almoraChapterDisplay(c){
  const type=c.type||'chapter';
  if(type==='chapter')return 'Capítulo '+(c.label||c.n);
  if(type==='extra')return c.label||'Extra';
  if(type==='special')return c.label||'Especial';
  if(type==='prologue')return c.label||'Prólogo';
  if(type==='epilogue')return c.label||'Epílogo';
  return 'Capítulo '+c.n;
}
const upd=ws=>`<div class="grid">${ws.map(w=>card(w,[...w.chapters].sort((a,b)=>b.date-a.date).slice(0,2).map(c=>`<div class="ch"><b>${esc(almoraChapterDisplay(c))}${Date.now()-c.date<864e5*3?' <span class="new">New</span>':''}</b><span>${ago(c.date)}</span></div>`).join(''))).join('')}</div>`;
const pub=()=>S.works.filter(w=>!w.archived);
function nav(r){
  const links=[
    ['home','Início'],
    ['bl','BL'],
    ['gl','GL'],
    ['explorar','Explorar'],
    ['atualizacoes','Atualizações'],
    ['biblioteca','Minha biblioteca']
  ];

  $('#nav').innerHTML=links
    .map(([h,t])=>`<a href="#${h}" class="${r===h?'on':''}" ${h==='notificacoes'?'data-notifications-link':''}>${t}</a>`)
    .join('');
  window.almoraRefreshNotificationBadge?.();
  }
function home(){const p=pub(),byR=[...p].sort((a,b)=>(b.reads||0)-(a.reads||0)),byU=[...p].sort((a,b)=>last(b)-last(a));
return (p.length?'':`<div class="empty"><b>Bem-vindo(a) à ALMORA.</b><br>O catálogo está vazio. Cadastre a primeira obra no <a href="#studio" style="color:var(--ac)"><u>ALMORA STUDIO</u></a>.</div>`)+
sec('Popular hoje',byR.filter(w=>w.reads).slice(0,10),rowOf)+sec('Últimas atualizações',byU.filter(w=>w.chapters.length).slice(0,12),upd)+
sec('BL em destaque',byU.filter(w=>w.cat==='BL').slice(0,8),rowOf)+sec('GL em destaque',byU.filter(w=>w.cat==='GL').slice(0,8),rowOf)+
sec('Recém-adicionadas',[...p].sort((a,b)=>b.created-a.created).slice(0,8),rowOf)+sec('Concluídas',p.filter(w=>w.status==='Concluída').slice(0,8),rowOf)}
let catalogFilters={status:'',genre:'',age:'',trope:'',category:'',sort:'u'};
function catalog(cat,t){
  const q=($('#q').value||'').toLowerCase().trim();
  const all=pub().filter(w=>!cat||w.cat===cat);
  const genres=[...new Set(all.flatMap(w=>(w.genres||'').split(',').map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const ages=[...new Set(all.map(w=>w.age).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
  const tropes=[...new Set(all.flatMap(w=>Array.isArray(w.tropes)?w.tropes:[]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR'));
  const f=all.filter(w=>
    (!catalogFilters.category||w.cat===catalogFilters.category)&&
    (!catalogFilters.status||w.status===catalogFilters.status)&&
    (!catalogFilters.genre||(w.genres||'').split(',').map(x=>x.trim()).includes(catalogFilters.genre))&&
    (!catalogFilters.age||String(w.age||'')===catalogFilters.age)&&
    (!catalogFilters.trope||(w.tropes||[]).includes(catalogFilters.trope))&&
    (!q||[w.title,w.alt,w.author,w.illus,w.genres,(w.tropes||[]).join(' '),w.synopsis].join(' ').toLowerCase().includes(q))
  );
  const rt=w=>(S.rate[w.id]||0);
  const ordered=[...f].sort(catalogFilters.sort==='a'?(a,b)=>a.title.localeCompare(b.title,'pt-BR'):
    catalogFilters.sort==='r'?(a,b)=>(b.reads||0)-(a.reads||0):
    catalogFilters.sort==='n'?(a,b)=>b.created-a.created:
    catalogFilters.sort==='s'?(a,b)=>rt(b)-rt(a):
    (a,b)=>last(b)-last(a));
  return `<h2>${esc(t)}</h2>
    <div class="act almora-catalog-filters" aria-label="Filtros do catálogo">
      ${!cat?`<select aria-label="Categoria" onchange="catalogFilters.category=this.value;ren()"><option value="">Categoria: todas</option><option value="BL" ${catalogFilters.category==='BL'?'selected':''}>BL</option><option value="GL" ${catalogFilters.category==='GL'?'selected':''}>GL</option></select>`:''}
      <select aria-label="Status" onchange="catalogFilters.status=this.value;ren()"><option value="">Status: todos</option>${['Em andamento','Concluída','Pausada','Cancelada'].map(x=>`<option value="${esc(x)}" ${catalogFilters.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select aria-label="Gênero" onchange="catalogFilters.genre=this.value;ren()"><option value="">Gênero: todos</option>${genres.map(x=>`<option value="${esc(x)}" ${catalogFilters.genre===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select aria-label="Classificação indicativa" onchange="catalogFilters.age=this.value;ren()"><option value="">Classificação: todas</option>${ages.map(x=>`<option value="${esc(x)}" ${catalogFilters.age===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select aria-label="Tags" onchange="catalogFilters.trope=this.value;ren()"><option value="">Tags: todas</option>${tropes.map(x=>`<option value="${esc(x)}" ${catalogFilters.trope===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select aria-label="Ordenação" onchange="catalogFilters.sort=this.value;ren()"><option value="u" ${catalogFilters.sort==='u'?'selected':''}>Atualizadas recentemente</option><option value="r" ${catalogFilters.sort==='r'?'selected':''}>Mais lidas</option><option value="a" ${catalogFilters.sort==='a'?'selected':''}>Ordem alfabética</option><option value="n" ${catalogFilters.sort==='n'?'selected':''}>Mais recentes</option><option value="s" ${catalogFilters.sort==='s'?'selected':''}>Melhor avaliadas</option></select>
      <button type="button" class="g" onclick="catalogFilters={status:'',genre:'',age:'',trope:'',category:'',sort:'u'};$('#q').value='';ren()">Limpar filtros</button>
    </div>
    ${ordered.length?gridOf(ordered):'<div class="empty">Nenhuma obra corresponde aos filtros selecionados.</div>'}`;
}

function obra(id){const w=W(id);if(!w)return`<div class="empty">Obra não encontrada.</div>`;                 
const lp=S.prog[id],cs=[...w.chapters].sort((a,b)=>(a.order??a.n)-(b.order??b.n)),r=S.rate[id]||0,ls=S.lib[id]||'';
return `<div class="hero"><div class="cv" ${cover(w)}></div><div><h1 style="margin:0">${esc(w.title)}</h1><div style="color:var(--mu)">${esc(w.alt)}</div>
<div style="margin:8px 0"><span class="pill">${w.cat}</span><span class="pill">${esc(w.status)}</span><span class="pill">${esc(w.age)}</span>${(w.genres||'').split(',').filter(x=>x.trim()).map(g=>`<span class="pill">${esc(g.trim())}</span>`).join('')}${(w.tropes||[]).map(tag=>`<span class="pill almora-tag">#${esc(tag)}</span>`).join('')}</div>
<div>Autor: ${esc(w.author||'—')} · Ilustrador: ${esc(w.illus||'—')}</div><div>${cs.length} capítulos · 👁 ${w.reads||0} leituras</div><div id="almora-work-like-count" style="color:var(--mu);font-size:13px;margin-top:4px"></div>
<div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=r?'on':''}" onclick="rate('${id}',${i})">★</span>`).join('')}</div>
<div class="act">${cs.length?`<button onclick="location.hash='#ler/${id}/${lp?lp.n:cs[0].n}'">${lp?'Continuar lendo (cap. '+esc(lp.n)+')':'Começar a ler'}</button>`:''}

async function fav(id){
  const next=!S.fav[id];
  if(next)S.fav[id]=true;
  else delete S.fav[id];
  save();
  ren();

  if(!user)return;

  try{
    const q=next
      ?await almoraDB.from('favorites').upsert(
        {user_id:user.id,work_id:id},
        {onConflict:'user_id,work_id'}
      )
      :await almoraDB.from('favorites')
        .delete()
        .eq('user_id',user.id)
        .eq('work_id',id);

    if(q.error)throw q.error;
  }catch(e){
    if(next)delete S.fav[id];
    else S.fav[id]=true;
    save();
    ren();
    toast('Não foi possível sincronizar a favorita.');
    console.error(e);
  }
  }
  async function almoraSyncFavorites(){
  if(!user)return;

  const marker='almora_favorites_migrated_'+user.id;

  try{
    if(!localStorage.getItem(marker)){
      const ids=Object.keys(S.fav||{}).filter(id=>S.fav[id]);

      if(ids.length){
        const rows=ids.map(work_id=>({
          user_id:user.id,
          work_id
        }));

        const {error}=await almoraDB
          .from('favorites')
          .upsert(rows,{onConflict:'user_id,work_id'});

        if(error)throw error;
      }

      localStorage.setItem(marker,'1');
    }

    const {data,error}=await almoraDB
      .from('favorites')
      .select('work_id')
      .eq('user_id',user.id);

    if(error)throw error;

    S.fav={};
    (data||[]).forEach(item=>{
      S.fav[item.work_id]=true;
    });

    save();
  }catch(e){
    console.error('Erro ao sincronizar favoritas:',e);
    toast('Não foi possível carregar suas favoritas.');
  }
  }
  async function almoraSyncReadingProgress(){
  if(!user)return;

  const marker='almora_progress_migrated_'+user.id;

  try{
    if(!localStorage.getItem(marker)){
      const rows=[];
      const activities=[];

      Object.entries(S.prog||{}).forEach(([workId,p])=>{
        const w=W(workId);
        if(!w||!p||!p.n)return;

        const c=w.chapters.find(x=>Number(x.n)===Number(p.n));
        if(!c||!c.id)return;

        const page=Math.max(1,Number(p.pg||0)+1);

        rows.push({
          user_id:user.id,
          work_id:workId,
          chapter_id:c.id,
          page_number:page
        });

        activities.push({
          user_id:user.id,
          work_id:workId,
          chapter_id:c.id,
          pages_read:page
        });
      });

      if(rows.length){
        const {error}=await almoraDB
          .from('reading_progress')
          .upsert(rows,{onConflict:'user_id,work_id'});

        if(error)throw error;
      }

      if(activities.length){
        const {error}=await almoraDB
          .from('reading_activity')
          .upsert(activities,{onConflict:'user_id,chapter_id'});

        if(error)throw error;
      }

      localStorage.setItem(marker,'1');
    }

    const {data,error}=await almoraDB
      .from('reading_progress')
      .select('work_id,chapter_id,page_number,completed')
      .eq('user_id',user.id);

    if(error)throw error;

    (data||[]).forEach(item=>{
      const w=W(item.work_id);
      if(!w)return;

      const c=w.chapters.find(x=>x.id===item.chapter_id);
      if(!c)return;

      const p=S.prog[item.work_id]||{read:[]};
      p.n=c.n;
      p.pg=Math.max(0,Number(item.page_number)-1);

      if(!p.read.includes(c.n))p.read.push(c.n);

      S.prog[item.work_id]=p;
    });

    save();
  }catch(e){
    console.error('Erro ao sincronizar progresso:',e);
    toast('Não foi possível sincronizar seu progresso.');
  }
  }
  async function almoraSaveReadingProgress(workId,chapterNumber,pageIndex){
  if(!user)return;

  const w=W(workId);
  const c=w?.chapters.find(x=>Number(x.n)===Number(chapterNumber));
  if(!c?.id)return;

  try{
    const pageNumber=Math.max(1,Number(pageIndex)+1);
    const totalPages=Array.isArray(c.pages)?c.pages.length:0;
    const now=new Date().toISOString();

    const {error:progressError}=await almoraDB
      .from('reading_progress')
      .upsert({
        user_id:user.id,
        work_id:workId,
        chapter_id:c.id,
        page_number:pageNumber
      },{onConflict:'user_id,work_id'});

    if(progressError)throw progressError;

    // Mantém a maior página alcançada para que revisitar páginas anteriores
    // não desconte páginas do histórico diário.
    const {data:previous,error:previousError}=await almoraDB
      .from('reading_activity')
      .select('pages_read,completed_at')
      .eq('user_id',user.id)
      .eq('chapter_id',c.id)
      .maybeSingle();

    if(previousError)throw previousError;

    const highestPage=Math.max(pageNumber,Number(previous?.pages_read||0));
    const completedAt=previous?.completed_at ||
      (totalPages>0 && pageNumber>=totalPages ? now : null);

    const activity={
      user_id:user.id,
      work_id:workId,
      chapter_id:c.id,
      pages_read:highestPage,
      last_read_at:now
    };
    if(completedAt)activity.completed_at=completedAt;

    const {error:activityError}=await almoraDB
      .from('reading_activity')
      .upsert(activity,{onConflict:'user_id,chapter_id'});

    if(activityError)throw activityError;

    // A sincronização só é necessária quando um capítulo acaba de ser concluído.
    if(!previous?.completed_at && completedAt){
      const {error:achievementError}=await almoraDB.rpc('almora_sync_achievements');
      if(achievementError){
        console.warn('Não foi possível sincronizar conquistas:',achievementError);
      }else if(typeof toast==='function'){
        toast('Capítulo concluído! Seu progresso e suas conquistas foram atualizados.');
      }
    }
  }catch(e){
    console.error('Erro ao salvar progresso:',e);
  }
}

const authErr=e=>{
  const msgs={
    'invalid_credentials':'E-mail ou senha incorretos.',
    'weak_password':'Senha fraca.',

async function loadCatalog(){
  try{
    const [
      {data:works,error:worksError},
      {data:chapters,error:chaptersError},
      {data:pages,error:pagesError}
    ] = await Promise.all([
      almoraDB.from('works').select('*').order('created_at',{ascending:false}),
      almoraDB.from('chapters').select('*').order('reading_order',{ascending:true}).order('chapter_number',{ascending:true}),
      almoraDB.from('pages').select('*').order('page_number')
    ]);

    if(worksError)throw worksError;
    if(chaptersError)throw chaptersError;
    if(pagesError)throw pagesError;

    const oldWorks=S.works||[];
    const pageGroups={};

    pages.forEach(p=>{
      if(!pageGroups[p.chapter_id])pageGroups[p.chapter_id]=[];
      pageGroups[p.chapter_id].push(p);
    });

    const chapterGroups={};

    chapters.forEach(c=>{
      if(!chapterGroups[c.work_id])chapterGroups[c.work_id]=[];

      const chapterPages=(pageGroups[c.id]||[])
        .sort((a,b)=>a.page_number-b.page_number)
        .map(p=>p.image_url);

      chapterGroups[c.work_id].push({
        id:c.id,
        n:Number(c.chapter_number),
        title:c.title||'',
        type:c.chapter_type||'chapter',
        label:c.chapter_label||'',
        order:Number(c.reading_order??c.chapter_number),
        date:new Date(c.created_at).getTime(),
        pages:chapterPages
      });
    });

    const remoteWorks=works.map(w=>{
      const old=oldWorks.find(x=>x.id===w.id);

      return {
        id:w.id,
        title:w.title,
        alt:w.alternative_title||'',
        cat:w.work_type,
        author:w.author_name||'',
        illus:w.illustrator||'',
        genres:(w.genre||[]).join(', '),
        tropes:Array.isArray(w.tropes)?w.tropes:[],
        age:w.age_rating,
        status:w.work_status||'Em andamento',
        rights:w.rights_holder||'',
        synopsis:w.synopsis||'',
        cover:w.cover_url||'',
        created:new Date(w.created_at).getTime(),
        reads:old?.reads||0,
        archived:old?.archived||false,
        chapters:chapterGroups[w.id]||[]
      };
    });

    S.works=remoteWorks;
  }catch(e){
    console.error('Erro ao carregar catálogo:',e);
    toast('Erro ao carregar catálogo: '+e.message);
  }
}

async function initAuth(){
  try{
    const {data,error}=await almoraDB.auth.getSession();
    if(error)throw error;

    user=data.session?.user||null;
    head();

    await loadCatalog();
    await almoraSyncFavorites();
    await almoraSyncReadingProgress();
    ren();

    almoraDB.auth.onAuthStateChange((event,session)=>{
      user=session?.user||null;
      head();

      if(event==='SIGNED_IN' || event==='SIGNED_OUT'){
        loadCatalog().then(async()=>{
          await almoraSyncFavorites();
          await almoraSyncReadingProgress();
          ren();
        });
      }else if((location.hash.slice(1)||'home').split('/')[0]==='conta'){
        ren();
      }
    });

  }catch(e){
    toast('Falha ao iniciar: '+e.message);
    console.error(e);
  }
}

async function mail(){
  const e=$('#a_e').value.trim();
  const p=$('#a_p').value;

  try{
    if(authMode==='up'){
      if(p!==$('#a_p2').value)return toast('As senhas não coincidem.');

      const n=$('#a_n').value.trim();

      const {data,error}=await almoraDB.auth.signUp({
        email:e,
        password:p,
        options:{data:{display_name:n}}
      });

      if(error)throw error;
      user=data.user;
      toast('Conta criada com sucesso!');
    }else{
      const {data,error}=await almoraDB.auth.signInWithPassword({
        email:e,
        password:p
      });

      if(error)throw error;
      user=data.user;
      toast('Bem-vindo(a) de volta!');
    }

    location.hash='#home';
  }catch(x){
    toast(authErr(x));
  }
}

async function pages(el){
  const files=[...el.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!files.length)return;
  draft=[];
  drawD();
  try{
    const expanded=[];
    for(const file of files){
      const ext=file.name.split('.').pop().toLowerCase();

      if(ext==='cbz'||ext==='zip'){
        if(typeof JSZip==='undefined')throw new Error('O leitor ZIP não carregou. Atualize a página e tente novamente.');
        const archive=await JSZip.loadAsync(file);
        const entries=Object.values(archive.files)
          .filter(entry=>!entry.dir&&!entry.name.split('/').some(part=>part==='__MACOSX'||part.startsWith('._'))&&/\.(jpe?g|png|webp|gif|avif)$/i.test(entry.name))
          .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));

        if(!entries.length)throw new Error('O arquivo '+file.name+' não contém imagens compatíveis.');

        for(const entry of entries){
          const blob=await entry.async('blob');
          const name=entry.name.split('/').pop();
          expanded.push(new File([blob],name,{type:blob.type||'application/octet-stream'}));
        }
      }else if(file.type.startsWith('image/')){
        expanded.push(file);
      }else{
        throw new Error('Formato não suportado: '+file.name);
      }
    }

    if(expanded.length>300)throw new Error('O limite é de 300 páginas por capítulo.');
    const totalBytes=expanded.reduce((sum,file)=>sum+file.size,0);
    if(totalBytes>120*1024*1024)throw new Error('O capítulo ultrapassa o limite de 120 MB descompactados.');

    draft=(await Promise.all(expanded.map(file=>comp(file,900)))).filter(Boolean);
    if(!draft.length)throw new Error('Não foi possível encontrar imagens válidas nesses arquivos.');

    drawD();
    toast(draft.length+' páginas prontas para publicar.');
  }catch(e){
    draft=[];
    drawD();
    toast('Erro ao ler capítulo: '+e.message);
  }finally{
    el.value='';
   }
  }
  async function almoraUploadToR2(file) {
  const { data: { session }, error } = await almoraDB.auth.getSession();

  if (error) throw error;
  if (!session) throw new Error('Faça login novamente.');

  const form = new FormData();
  form.append('file', file);

  const response = await fetch(
    'https://almora-storage.kauansousa353.workers.dev/upload',
    {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${session.access_token}`
      },
      body: form
    }
  );

  const text = await response.text();
  let result = {};

  try {
    result = JSON.parse(text);
  } catch {}

  if (!response.ok) {
    throw new Error(result.error || text || 'Erro ao enviar imagem.');
  }

  if (!result.url) throw new Error('URL da imagem não recebida.');

  return result.url;
  }

    const {data:chapters,error:chapError}=await almoraDB
      .from('chapters')
      .select('id')
      .eq('work_id',id);

    if(chapError)throw chapError;

    const ids=(chapters||[]).map(c=>c.id);

    if(ids.length){
      const {error:pagesError}=await almoraDB
        .from('pages')
        .delete()
        .in('chapter_id',ids);

      if(pagesError)throw pagesError;

      const {error:chaptersError}=await almoraDB
        .from('chapters')
        .delete()
        .in('id',ids);

      if(chaptersError)throw chaptersError;
    }

    const {error:workError}=await almoraDB
      .from('works')
      .delete()
      .eq('id',id);

    if(workError)throw workError;

    S.works=S.works.filter(w=>String(w.id)!==String(id));

}

  m = name.match(/^extra\s*(\d+(?:[.,]\d+)?)?\s*(?:[-–—:]\s*(.*))?$/i);
  if (m) return {type:'extra', label:'Extra'+(m[1]?' '+m[1].replace(',','.'):''), number:'', title:(m[2]||'').trim()};

  m = name.match(/^especial\s*(?:[-–—:]\s*|\s+)?(.*)$/i);
  if (m) return {type:'special', label:'Especial', number:'', title:(m[1]||'').trim()};

  m = name.match(/^(pr[oó]logo)\s*(?:[-–—:]\s*)?(.*)$/i);
  if (m) return {type:'prologue', label:'Prólogo', number:'', title:(m[2]||'').trim()};

  m = name.match(/^(ep[ií]logo)\s*(?:[-–—:]\s*)?(.*)$/i);
  if (m) return {type:'epilogue', label:'Epílogo', number:'', title:(m[2]||'').trim()};

  m = name.match(/^(?:cap[ií]tulo|cap\.?)\s*(\d+(?:[.,]\d+)?)\s*(?:[-–—:]\s*(.*))?$/i);
  if (!m) m = name.match(/^(\d+(?:[.,]\d+)?)\s*[-–—:]\s*(.*)$/);
  if (!m) m = name.match(/^(\d+(?:[.,]\d+)?)$/);

  if (m) {
    const number=m[1].replace(',','.');
    return {type:'chapter',label:number,number,title:(m[2]||'').trim()};
  }
  return {type:'chapter',label:'',number:'',title:''};
}

function almoraNextInternalNumber(work) {
  const used=(work?.chapters||[]).map(c=>Number(c.n)).filter(Number.isFinite);
  let candidate=-1;
  while(used.includes(candidate)) candidate--;
  return candidate;
}

function almoraBatchUpdate(index,key,value) {
  const item=almoraBatch[index];
  if(!item || item.status==='Enviando' || item.status==='Publicado') return;
  item[key]=value;

  if(key==='type') {
    if(value==='chapter') {
      item.number=/^\d+(?:[.,]\d+)?$/.test(item.label)?item.label.replace(',','.'):'';
    } else {
      item.number='';
      if(/^\d+(?:[.,]\d+)?$/.test(item.label)) {
        item.label=({extra:'Extra',special:'Especial',prologue:'Prólogo',epilogue:'Epílogo'})[value]||'';
      } else if(!item.label) {
        item.label=({extra:'Extra',special:'Especial',prologue:'Prólogo',epilogue:'Epílogo'})[value]||'';
      }
    }
  }
  if(key==='number' && item.type==='chapter') item.label=String(value);
  almoraBatchRender();
}

function almoraBatchRemove(index) {
  if(almoraBatch[index]?.status==='Enviando') return;
  almoraBatch.splice(index,1);
  almoraBatchRender();
}

function almoraClearPublishedBatch() {
  almoraBatch=almoraBatch.filter(x=>x.status!=='Publicado');
  almoraBatchRender();
}

function almoraBatchRender() {
  const box=document.getElementById('almora-batch-review');
  if(!box) return;
  if(!almoraBatch.length) { box.innerHTML=''; return; }

  const total=almoraBatch.length;
  const done=almoraBatch.filter(x=>x.status==='Publicado').length;
  const percent=Math.round(almoraBatch.reduce((sum,x)=>sum+(x.status==='Publicado'?100:x.status==='Enviando'?x.progress:0),0)/Math.max(1,total));

  box.innerHTML=`
    <div style="margin-top:16px">
      <b>Revisão dos arquivos (${total})</b>
      <div style="margin:8px 0;color:var(--mu);font-size:13px">${done} de ${total} publicados · Progresso geral: ${percent}%</div>
      <progress value="${percent}" max="100" style="width:100%"></progress>
      ${almoraBatch.map((item,i)=>`
        <div class="box" style="margin-top:10px">
          <b>${esc(item.file.name)}</b>
          <small style="display:block;color:var(--mu)">${item.pages.length} páginas identificadas</small>
          <label>Título do capítulo</label>
          <input value="${esc(item.title)}" ${item.status==='Enviando'||item.status==='Publicado'?'disabled':''}
            onchange="almoraBatchUpdate(${i},'title',this.value)">
          <label>Tipo</label>
          <select ${item.status==='Enviando'||item.status==='Publicado'?'disabled':''}
            onchange="almoraBatchUpdate(${i},'type',this.value)">
            <option value="chapter" ${item.type==='chapter'?'selected':''}>Capítulo</option>
            <option value="extra" ${item.type==='extra'?'selected':''}>Extra</option>
            <option value="special" ${item.type==='special'?'selected':''}>Especial</option>
            <option value="prologue" ${item.type==='prologue'?'selected':''}>Prólogo</option>
            <option value="epilogue" ${item.type==='epilogue'?'selected':''}>Epílogo</option>
          </select>
          <label>Identificação exibida ao leitor</label>
          <input value="${esc(item.label)}" placeholder="Ex.: 12, Extra 2, Especial..."
            ${item.status==='Enviando'||item.status==='Publicado'?'disabled':''}
            onchange="almoraBatchUpdate(${i},'label',this.value)">
          ${item.type==='chapter'?`
            <label>Número do capítulo</label>
            <input type="number" step="0.1" value="${esc(item.number)}"
              ${item.status==='Enviando'||item.status==='Publicado'?'disabled':''}
              onchange="almoraBatchUpdate(${i},'number',this.value)">
          `:''}
          <label>Ordem de leitura</label>
          <input type="number" step="0.1" value="${esc(item.order)}"
            ${item.status==='Enviando'||item.status==='Publicado'?'disabled':''}
            onchange="almoraBatchUpdate(${i},'order',this.value)">
          <div style="margin-top:10px">
            <small>${esc(item.status)}</small>
            ${item.status==='Enviando'?`<progress value="${item.progress}" max="100" style="width:100%"></progress><small>${item.progress}%</small>`:''}
            ${item.error?`<small style="display:block;color:#e66">${esc(item.error)}</small>`:''}
          </div>
          ${item.status!=='Publicado'?`<button class="d" style="margin-top:8px" ${item.status==='Enviando'?'disabled':''} onclick="almoraBatchRemove(${i})">Remover arquivo</button>`:''}
        </div>
      `).join('')}
      <button onclick="almoraPublishBatch()" ${almoraBatch.some(x=>x.status==='Enviando')||!almoraBatch.some(x=>x.status!=='Publicado'&&x.archive)?'disabled':''}>
        Publicar capítulos selecionados
      </button>
      <button class="g" style="margin-left:6px" onclick="almoraClearPublishedBatch()" ${done===0?'disabled':''}>Limpar publicados</button>
    </div>
  `;
}

async function almoraPrepareBatch(input) {
  const files=[...input.files];
  if(!files.length) return;

  const workId=document.getElementById('c_w')?.value;
  const work=W(workId);
  if(!work) { toast('Escolha uma obra antes de selecionar os arquivos.'); input.value=''; return; }

  if(almoraBatch.some(x=>x.workId!==workId)) {
    toast('Publique ou remova a revisão anterior antes de escolher arquivos de outra obra.');
    input.value='';
    return;
  }
  if(typeof JSZip==='undefined') { toast('Leitor ZIP não carregado. Atualize a página.'); input.value=''; return; }

  let maxOrder=Math.max(0,...work.chapters.map(c=>Number(c.order??c.n)||0),...almoraBatch.map(c=>Number(c.order)||0));

  for(const file of files) {
    try {
      if(!/\.(cbz|zip)$/i.test(file.name)) throw new Error('Use arquivos CBZ ou ZIP.');
      const parsed=almoraParseChapterFilename(file.name);
      const archive=await JSZip.loadAsync(file);
      const entries=Object.values(archive.files)
        .filter(e=>!e.dir&&!e.name.split('/').some(p=>p==='__MACOSX'||p.startsWith('._'))&&/\.(jpe?g|png|webp|gif|avif)$/i.test(e.name))
        .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));

      if(!entries.length) throw new Error('Nenhuma imagem encontrada.');
      if(entries.length>300) throw new Error('Limite de 300 páginas por capítulo.');
      const totalBytes=entries.reduce((sum,e)=>sum+(Number(e._data?.uncompressedSize)||0),0);
      if(totalBytes>120*1024*1024) throw new Error('Arquivo ultrapassa 120 MB descompactados.');

      almoraBatch.push({
        file,archive,pages:entries,workId,
        type:parsed.type,label:parsed.label,number:parsed.number,
        title:parsed.title,order:++maxOrder,
        status:'Aguardando revisão',progress:0,error:''
      });
    } catch(error) {
      almoraBatch.push({
        file,archive:null,pages:[],workId,type:'chapter',label:'',number:'',
        title:'',order:++maxOrder,status:'Arquivo inválido',progress:0,error:error.message
      });
    }
    almoraBatchRender();
  }
  input.value='';
}

async function almoraPublishBatch() {
  if(!user) return toast('Entre na conta administrativa.');
  if(!unlocked) return toast('Acesso restrito à administração.');

  const pending=almoraBatch.filter(x=>x.status!=='Publicado'&&x.archive&&x.status!=='Enviando');
  if(!pending.length) return toast('Não há capítulos válidos aguardando publicação.');

  const workIds=[...new Set(pending.map(x=>x.workId))];
  if(workIds.length!==1) return toast('Separe os envios por obra.');
  const workId=workIds[0];
  const work=W(workId);
  if(!work) return toast('Obra não encontrada.');

  const pendingChapterNumbers=[];
  const pendingLabels=[];
  const pendingOrders=[];
  for(const item of pending) {
    if(!String(item.label||'').trim()) return toast('Preencha a identificação de todos os capítulos.');
    if(String(item.order).trim()===''||!Number.isFinite(Number(item.order))) return toast('Confira a ordem de leitura.');
    const orderValue=Number(item.order);
    if(work.chapters.some(c=>Number(c.order??c.n)===orderValue)||pendingOrders.includes(orderValue))
      return toast('Há ordens de leitura repetidas. Ajuste a posição de cada arquivo.');
    pendingOrders.push(orderValue);
    if(item.type==='chapter') {
      if(String(item.number).trim()===''||!Number.isFinite(Number(item.number))) return toast('Informe o número de cada capítulo normal.');
      const number=String(Number(item.number));
      if(work.chapters.some(c=>(c.type||'chapter')==='chapter'&&String(Number(c.n))===number)||pendingChapterNumbers.includes(number))
        return toast('Há números de capítulos duplicados. Confira a revisão.');
      pendingChapterNumbers.push(number);
    } else {
      const normalized=String(item.label).trim().toLocaleLowerCase('pt-BR');
      const titleKey=String(item.title||'').trim().toLocaleLowerCase('pt-BR');
      const labelKey=item.type+'|'+normalized+'|'+titleKey;
      if(work.chapters.some(c=>(c.type||'chapter')===item.type&&String(c.label||'').trim().toLocaleLowerCase('pt-BR')===normalized&&String(c.title||'').trim().toLocaleLowerCase('pt-BR')===titleKey)||pendingLabels.includes(labelKey))
        return toast('Há identificações repetidas para o mesmo tipo de conteúdo.');
      pendingLabels.push(labelKey);
    }
  }

  for(const item of pending) {
    item.status='Enviando'; item.progress=0; item.error=''; almoraBatchRender();
    try {
      const uploaded=[];
      let totalUncompressed=0;
      for(let i=0;i<item.pages.length;i++) {
        const entry=item.pages[i];
        const original=await entry.async('blob');
        totalUncompressed+=original.size;
        if(totalUncompressed>120*1024*1024) throw new Error('Capítulo ultrapassa 120 MB descompactados.');
        const pageFile=new File([original],entry.name.split('/').pop(),{type:original.type||'image/jpeg'});
        const compressed=await comp(pageFile,900);
        if(!compressed) throw new Error('Falha ao processar uma página.');
        const blob=await fetch(compressed).then(r=>r.blob());
        const url=await almoraUploadToR2(blob);
        uploaded.push({page_number:i+1,image_url:url});
        item.progress=Math.round(((i+1)/item.pages.length)*90);
        almoraBatchRender();
      }

      const chapterNumber=item.type==='chapter'?Number(item.number):almoraNextInternalNumber(work);
      const {data:chapter,error:chapterError}=await almoraDB.from('chapters').insert({
        work_id:workId,chapter_number:chapterNumber,
        title:item.title.trim()||item.label.trim(),
        status:'published',chapter_type:item.type,
        chapter_label:item.label.trim(),reading_order:Number(item.order)
      }).select().single();
      if(chapterError) throw chapterError;

      const pageRows=uploaded.map(p=>({chapter_id:chapter.id,page_number:p.page_number,image_url:p.image_url}));
      const {error:pagesError}=await almoraDB.from('pages').insert(pageRows);
      if(pagesError) {
        await almoraDB.from('chapters').delete().eq('id',chapter.id);
        throw pagesError;
      }

      item.status='Publicado'; item.progress=100;
      work.chapters.push({
        id:chapter.id,n:chapterNumber,title:item.title||item.label,
        type:item.type,label:item.label,order:Number(item.order),
        date:Date.now(),pages:uploaded.map(p=>p.image_url)
      });
    } catch(error) {
      item.status='Falhou'; item.error=error.message||'Erro desconhecido';
    }
    almoraBatchRender();
  }

  await loadCatalog();
  ren();
  const successes=almoraBatch.filter(x=>x.status==='Publicado').length;
  const failures=almoraBatch.filter(x=>x.status==='Falhou'||x.status==='Arquivo inválido').length;
  toast(`${successes} capítulo(s) publicado(s). ${failures} falha(s).`);
}

ren();initAuth();

<script>
(() => {
  const box = document.querySelector('#toast');
  if (!box) return;

  let timer;
  let hideTimer;

  const types = {
    success: { icon: '✓', color: '#36c98f' },
    error:   { icon: '✕', color: '#ff657a' },
    warning: { icon: '⚠', color: '#f3bd55' },
    info:    { icon: 'ⓘ', color: '#b77aff' },
    loading: { icon: '◌', color: '#b77aff' }
  };

  function notify(message, type = 'info', duration = 3500) {
    const config = types[type] || types.info;

    clearTimeout(timer);
    clearTimeout(hideTimer);

    box.classList.remove('almora-hide', 'almora-show');

    const content = document.createElement('div');
    content.className = 'almora-message';

    const icon = document.createElement('span');
    icon.className = 'almora-icon';
    icon.textContent = config.icon;
    icon.style.color = config.color;

    const text = document.createElement('span');
    text.textContent = message;

    content.append(icon, text);
    box.replaceChildren(content);

    box.style.display = 'block';
    requestAnimationFrame(() => {
      box.classList.add('almora-show');
    });

    if (duration > 0) {
      timer = setTimeout(() => {
        box.classList.remove('almora-show');
        box.classList.add('almora-hide');

        hideTimer = setTimeout(() => {
          box.classList.remove('almora-hide');
        }, 350);
      }, duration);
    }
  }

  window.almoraNotify = notify;

  // Mantém compatibilidade com as chamadas antigas de toast()
  window.toast = (message) => {
    const text = String(message);
    const type = /erro|falha|não foi possível/i.test(text)
      ? 'error'
      : /sucesso|atualizada|copiado|bem-vindo|autorizado/i.test(text)
      ? 'success'
      : 'info';

    notify(text, type);
  };
})();
</script>

<script>
(() => {
  const app = document.querySelector('#app');
  const originalRender = window.ren;

  if (!app || typeof originalRender !== 'function') return;

  let enterTimer;
  let lastAnimatedHash = null;

  window.ren = function(...args) {
    const route = (location.hash.slice(1) || 'home').split('/')[0];
    const currentHash = location.hash || '#home';
    const isNewPage = currentHash !== lastAnimatedHash;
    const chapterFile = app.querySelector('#c_f');

    const hasPendingChapter =
      (chapterFile && chapterFile.files.length > 0) ||
      (typeof draft !== 'undefined' && draft.length > 0);

    clearTimeout(enterTimer);

    if (route === 'studio' && hasPendingChapter) {
      app.classList.remove('almora-leaving', 'almora-entering');
      lastAnimatedHash = currentHash;
      return;
    }

    // Chamadas internas de atualização não devem reiniciar a animação.
    if (!isNewPage) {
      app.classList.remove('almora-entering');
      return originalRender.apply(this, args);
    }

    lastAnimatedHash = currentHash;

    if (window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches) {
      app.classList.remove('almora-leaving', 'almora-entering');
      return originalRender.apply(this, args);
    }

    // Anima apenas quando o endereço da página realmente muda.
    originalRender.apply(this, args);

    app.classList.remove('almora-leaving', 'almora-entering');
    void app.offsetWidth;
    app.classList.add('almora-entering');

    enterTimer = setTimeout(() => {
      app.classList.remove('almora-entering');
    }, 700);
  };

  app.classList.add('almora-entering');

  enterTimer = setTimeout(() => {
    app.classList.remove('almora-entering');
  }, 700);
})();
</script>

<script>
(() => {
  function prepareImages(root = document) {
    root.querySelectorAll('.cv').forEach(el => {
      const bg = getComputedStyle(el).backgroundImage;
      const match = bg.match(/url\(["']?(.*?)["']?\)/);

      if (!match) {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
        return;
      }

      if (el.dataset.almoraChecked === 'yes') return;
      el.dataset.almoraChecked = 'yes';
      el.classList.add('almora-cover-loading');

      const img = new Image();

      img.onload = () => {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
      };

      img.onerror = () => {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
      };

      img.src = match[1];
    });

    root.querySelectorAll('.rd img').forEach(img => {
      if (img.dataset.almoraChecked === 'yes') return;
      img.dataset.almoraChecked = 'yes';

      if (img.complete && img.naturalWidth > 0) {
        img.classList.add('almora-img-ready');
      } else {
        img.addEventListener('load', () => {
          img.classList.add('almora-img-ready');
        }, { once: true });

        img.addEventListener('error', () => {
          img.classList.add('almora-img-error');
        }, { once: true });
      }
    });
  }

  prepareImages();

  const app = document.querySelector('#app');

  if (app) {
    new MutationObserver(() => prepareImages(app))
      .observe(app, { childList: true });
  }
})();
</script>

  .card, .work-card, .item,
  input, textarea, select, a {
    transition: none !important;

<style>
/* ALMORA — Perfis públicos */

.almora-profile {
  max-width: 720px;
  margin: 25px auto;
}

.almora-profile-head {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 22px;
}

.almora-avatar {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--sf2);
  border: 2px solid var(--ac);
}

.almora-profile-info {
  flex: 1;
  min-width: 180px;
}

.almora-profile-info h1 {
  margin: 0;
  font-size: 23px;
}

.almora-username {
  color: var(--ac);
  font-size: 14px;
}

.almora-bio {
  color: var(--mu);
  white-space: pre-wrap;
  margin-top: 14px;
}

.almora-profile form {
  margin-top: 18px;
}

.almora-profile form label {
  display: block;
  margin: 12px 0 4px;
  color: var(--mu);
}

.almora-profile form input,
.almora-profile form textarea {
  width: 100%;
}

.almora-profile-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}
</style>

<script>
(() => {
  let currentProfile = null;
  let profileRequest = 0;

  // O acesso ao perfil fica no menu da engrenagem, não no cabeçalho.

  // Conquistas públicas do leitor. O próprio usuário também visualiza as ainda bloqueadas.
  async function almoraRenderAchievements(profileId, ownProfile) {
    const mount = document.createElement('section');
    mount.className = 'almora-achievements';
    mount.innerHTML = '<h2>Conquistas</h2><div class="empty">Carregando conquistas...</div>';

    try {
      const [definitionsResult, unlockedResult] = await Promise.all([
        almoraDB.from('achievement_definitions').select('*').order('id'),
        almoraDB.from('user_achievements').select('*').eq('user_id', profileId)
      ]);

      if (definitionsResult.error) throw definitionsResult.error;
      if (unlockedResult.error) throw unlockedResult.error;

      const definitions = definitionsResult.data || [];
      const unlocked = new Map((unlockedResult.data || []).map(item => [
        item.achievement_id,
        item
      ]));
      const visible = ownProfile
        ? definitions
        : definitions.filter(item => unlocked.has(item.id));

      if (!visible.length) {
        mount.innerHTML = '<h2>Conquistas</h2><div class="empty">Ainda não há conquistas públicas desbloqueadas.</div>';
        return mount.outerHTML;
      }

      mount.innerHTML = `
        <h2>Conquistas ${ownProfile ? `(${unlocked.size}/${definitions.length})` : ''}</h2>
        <div class="almora-achievement-grid">
          ${visible.map(item => {
            const record = unlocked.get(item.id);
            const dateValue = record?.unlocked_at || record?.created_at;
            const date = dateValue
              ? new Date(dateValue).toLocaleDateString('pt-BR')
              : '';
            return `
              <article class="almora-achievement ${record ? 'is-unlocked' : 'is-locked'}">
                <div class="almora-achievement-icon" aria-hidden="true">${esc(item.icon || '🏅')}</div>
                <div class="almora-achievement-copy">
                  <strong>${esc(item.title || item.id)}</strong>
                  <p>${esc(item.description || '')}</p>
                  <small>${record ? `Desbloqueada${date ? ' em ' + date : ''}` : 'Ainda não desbloqueada'}</small>
                </div>
                <span class="almora-achievement-state" aria-label="${record ? 'Desbloqueada' : 'Bloqueada'}">${record ? '✓' : '🔒'}</span>
              </article>
            `;
          }).join('')}
        </div>
      `;
    } catch (error) {
      console.error('Erro ao carregar conquistas:', error);
      mount.innerHTML = '<h2>Conquistas</h2><div class="empty">Não foi possível carregar as conquistas.</div>';
    }

    return mount.outerHTML;
  }

  // Carrega um perfil.
  async function loadProfile(id) {
    const request = ++profileRequest;
    const app = $('#app');
    const isCurrentProfileRequest = () => {
      const parts = location.hash.slice(1).split('/');
      const activeId = parts[1] || user?.id;
      return request === profileRequest && parts[0] === 'perfil' && activeId === id;
    };
    app.dataset.almoraProfileLoading = '1';

    app.innerHTML =
      '<div class="empty">Carregando perfil...</div>';

    try {
      const own = user && user.id === id;

      // Verifica a privacidade do perfil.
      const { data: privacy, error: privacyError } =
        await almoraDB
          .from('profile_privacy')
          .select('profile_public,wishlist_public')
          .eq('user_id', id)
          .maybeSingle();

      if (!isCurrentProfileRequest()) return;
      if (privacyError) throw privacyError;

      if (privacy &&
          privacy.profile_public === false &&
          !own) {
        currentProfile = null;

        app.innerHTML = `
          <section class="almora-profile">
            <div class="empty">
              <h2>🔒 Este perfil é privado</h2>
              <p>
                O proprietário deste perfil escolheu
                limitar sua visualização.
              </p>
            </div>
          </section>
        `;
        delete app.dataset.almoraProfileLoading;
        return;
      }

      // Busca os dados do perfil.
      const { data, error } = await almoraDB
        .from('profiles')
        .select(
          'id,username,display_name,avatar_url,bio,created_at'
        )
        .eq('id', id)
        .maybeSingle();

      if (!isCurrentProfileRequest()) return;
      if (error) throw error;

      if (!data) {
        currentProfile = null;
        app.innerHTML =
          '<div class="empty">Perfil não encontrado.</div>';
        delete app.dataset.almoraProfileLoading;
        return;
      }

      currentProfile = data;

      const name = data.display_name || 'Leitor(a)';
      const username = data.username || 'leitor';
      const avatar = data.avatar_url || '';

      app.innerHTML = `
        <section class="almora-profile almora-profile-view">

          <div class="almora-profile-head">
            ${
              avatar
                ? `
                  <img class="almora-avatar"
                    src="${esc(avatar)}"
                    alt="Foto de perfil"
                    onerror="this.style.display='none'">
                `
                : `
                  <div class="almora-avatar"
                    style="display:grid;place-items:center">
                    <span style="font-size:36px">♧</span>
                  </div>
                `
            }

            <div class="almora-profile-info">
              <h1>${esc(name)}</h1>

              <div class="almora-username">
                @${esc(username)}
              </div>

              <div style="color:var(--mu);font-size:12px">
                Leitor(a) da ALMORA
              </div>
            </div>
          </div>

          <div class="almora-bio">
            ${esc(
              data.bio ||
              'Este leitor ainda não escreveu uma biografia.'
            )}
          </div>

          <div class="almora-profile-actions">

            ${
              own
                ? `
                  <button onclick="almoraEditProfile()">
                    Editar perfil
                  </button>

                  <button
                    id="almora-privacy-button"
                    class="g"
                    onclick="almoraOpenPrivacy()">
                    Privacidade
                  </button>

                  <button class="g" onclick="out()">
                    Sair da conta
                  </button>
                `
                : ''
            }

            <button class="g"
              onclick="almoraShareProfile('${data.id}')">
              Compartilhar perfil
            </button>

          </div>
        </section>
      `;

            if (own || (privacy && privacy.wishlist_public === true)) {
        const { data: wishlistItems, error: wishlistError } = await almoraDB
          .from('wishlists')
          .select('work_id')
          .eq('user_id', id);

        if (!isCurrentProfileRequest()) return;
        if (wishlistError) throw wishlistError;

        const wishlistWorks = (wishlistItems || [])
          .map(item => W(item.work_id))
          .filter(Boolean);

        app.innerHTML += wishlistWorks.length
          ? sec('Lista de desejos', wishlistWorks, gridOf)
          : '<h2>Lista de desejos</h2><div class="empty">Nenhuma obra adicionada à lista de desejos.</div>';
  }

      if (!isCurrentProfileRequest()) return;
      app.innerHTML += await almoraRenderAchievements(id, own);
      if (!isCurrentProfileRequest()) return;
      delete app.dataset.almoraProfileLoading;
      if (typeof window.almoraApplyProfileAppearance === 'function') {
        window.almoraApplyProfileAppearance();
      }
      if (typeof window.almoraInitProfileSocial === 'function') {
        window.almoraInitProfileSocial();
      }
    } catch (error) {
      if (!isCurrentProfileRequest()) return;

      currentProfile = null;
      delete app.dataset.almoraProfileLoading;

      app.innerHTML =
        '<div class="empty">Não foi possível carregar o perfil: ' +
        esc(error.message) + '</div>';
    }
  }

  // Abre a edição do perfil.
  window.almoraEditProfile = function() {
  if (!currentProfile || !user ||
      currentProfile.id !== user.id) return;

  $('#app').innerHTML = `
    <section class="almora-profile">
      <h2>Editar perfil</h2>

      <form onsubmit="event.preventDefault();almoraSaveProfile()">

        <label>Foto de perfil</label>

        <img
          id="profile_avatar_preview"
          src="${esc(currentProfile.avatar_url || '')}"
          alt="Prévia da foto"
          style="
            width:110px;
            height:110px;
            border-radius:50%;
            object-fit:cover;
            display:${currentProfile.avatar_url ? 'block' : 'none'};
            margin:12px 0;
          "
        >

        <input
          id="profile_avatar_file"
          type="file"
          accept="image/*"
          onchange="almoraPreviewAvatar(this)"
        >

        <small style="color:var(--mu)">
          Escolha uma imagem da galeria. Máximo: 5 MB.
        </small>

        <label>Nome de exibição</label>
        <input
          id="profile_name"
          maxlength="60"
          required
          value="${esc(currentProfile.display_name || '')}"
          oninput="almoraUpdateProfilePreview()"
        >

        <label>Biografia</label>
        <textarea
          id="profile_bio"
          rows="5"
          maxlength="300"
          placeholder="Conte um pouco sobre você..."
          oninput="almoraUpdateProfilePreview()"
        >${esc(currentProfile.bio || '')}</textarea>

        <div id="profile_live_preview" style="margin:20px 0;padding:18px;border:1px solid var(--bd);border-radius:16px;background:var(--sf)">
          <small style="display:block;color:var(--mu);margin-bottom:12px">Prévia em tempo real</small>
          <div style="display:flex;align-items:center;gap:14px">
            <img id="profile_live_avatar" src="${esc(currentProfile.avatar_url || '')}" alt="Foto do perfil" style="width:64px;height:64px;border-radius:50%;object-fit:cover;display:${currentProfile.avatar_url ? 'block' : 'none'}">
            <span id="profile_live_avatar_fallback" style="width:64px;height:64px;border-radius:50%;background:var(--bg);display:${currentProfile.avatar_url ? 'none' : 'grid'};place-items:center;font-size:26px">♡</span>
            <div style="min-width:0">
              <strong id="profile_live_name">${esc(currentProfile.display_name || 'Seu nome')}</strong>
              <small style="display:block;color:var(--mu)">@${esc(currentProfile.username || 'usuario')}</small>
            </div>
          </div>
          <p id="profile_live_bio" style="white-space:pre-wrap;margin:14px 0 0">${esc(currentProfile.bio || 'Sua biografia aparecerá aqui...')}</p>
        </div>

        <div class="almora-profile-actions">
          <button type="submit">Salvar alterações</button>
        </div>
      </form>
      <div class="almora-profile-actions">
        <button type="button" class="g" onclick="window.almoraOpenProfileEditor()">
          Personalizar perfil
        </button>
        <button type="button" class="g" onclick="window.ren()">
          Voltar ao perfil
        </button>
      </div>
    </section>
  `;
};

window.almoraPreviewAvatar = function(input) {
  const file = input.files && input.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    input.value = '';
    return toast('Selecione um arquivo de imagem.');
  }

  if (file.size > 5 * 1024 * 1024) {
    input.value = '';
    return toast('A imagem deve ter no máximo 5 MB.');
  }

  const preview = $('#profile_avatar_preview');
  const livePreview = $('#profile_live_avatar');
  const fallback = $('#profile_live_avatar_fallback');
  if (preview) {
    if (preview.dataset.objectUrl) URL.revokeObjectURL(preview.dataset.objectUrl);
    preview.dataset.objectUrl = URL.createObjectURL(file);
    preview.src = preview.dataset.objectUrl;
    preview.style.display = 'block';
  }
  if (livePreview) {
    if (livePreview.dataset.objectUrl) URL.revokeObjectURL(livePreview.dataset.objectUrl);
    livePreview.dataset.objectUrl = URL.createObjectURL(file);
    livePreview.src = livePreview.dataset.objectUrl;
    livePreview.style.display = 'block';
  }
  if (fallback) fallback.style.display = 'none';
};

window.almoraUpdateProfilePreview = function() {
  const name = $('#profile_name');
  const bio = $('#profile_bio');
  const previewName = $('#profile_live_name');
  const previewBio = $('#profile_live_bio');
  if (previewName && name) previewName.textContent = name.value.trim() || 'Seu nome';
  if (previewBio && bio) previewBio.textContent = bio.value.trim() || 'Sua biografia aparecerá aqui...';
};

window.almoraSaveProfile = async function() {
  if (!user || !currentProfile ||
      currentProfile.id !== user.id) return;

  const name = $('#profile_name').value.trim();
  const bio = $('#profile_bio').value.trim();
  const file = $('#profile_avatar_file').files[0];

  if (!name) return toast('Informe seu nome de exibição.');

  let avatar = currentProfile.avatar_url || null;

  try {
    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        return toast('A imagem deve ter no máximo 5 MB.');
      }

      const extensions = {
        'image/jpeg': 'jpg',
        'image/png': 'png',
        'image/webp': 'webp',
        'image/gif': 'gif'
      };

      const ext = extensions[file.type];

      if (!ext) {
        return toast('Formato não suportado. Use JPG, PNG, WEBP ou GIF.');
      }

      const path = `${user.id}/avatar-${Date.now()}.${ext}`;

      toast('Enviando foto...');

      const { data, error } = await almoraDB.storage
        .from('avatars')
        .upload(path, file, {
          contentType: file.type,
          cacheControl: '3600',
          upsert: false
        });

      if (error) throw error;

      avatar = almoraDB.storage
        .from('avatars')
        .getPublicUrl(data.path).data.publicUrl;
    }

    const { error } = await almoraDB
      .from('profiles')
      .update({
        display_name: name,
        avatar_url: avatar,
        bio: bio || null
      })
      .eq('id', user.id);

    if (error) throw error;

    toast('Perfil atualizado com sucesso!');
    await loadProfile(user.id);

  } catch (error) {
    toast('Erro ao atualizar perfil: ' + error.message);
  }
};

  // Compartilha o perfil.
  window.almoraShareProfile = async function(id) {
    const url =
      location.origin +
      location.pathname +
      '#perfil/' + id;

    try {
      await navigator.clipboard.writeText(url);
      toast('Link do perfil copiado!');
    } catch (error) {
      toast(url);
    }
  };

  // Conecta a rota #perfil ao sistema de navegação.
  const originalRender = window.ren;

  window.ren = function(...args) {
    originalRender.apply(this, args);

    const [route, id] = location.hash
      .slice(1)
      .split('/');

    if (route !== 'perfil') return;

    const target = id || user?.id;

    if (!target) {
      currentProfile = null;

      $('#app').innerHTML = `
        <div class="empty">
          Entre na sua conta para acessar seu perfil.
          <a href="#conta">Entrar</a>
        </div>
      `;
      return;
    }

    loadProfile(target);
  };

})();
</script>

<style>
/* ALMORA — Comentários das obras */
.almora-comments {
  margin: 28px 0;
  padding-top: 12px;
}
.almora-comment {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 13px;
  margin: 10px 0;
}
.almora-comment-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.almora-comment-author {
  color: var(--ac);
  font-weight: 600;
}
.almora-comment-date {
  color: var(--mu);
  font-size: 11px;
}
.almora-comment-body {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 10px 0;
}
.almora-comment-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.almora-comment-actions button {
  font-size: 12px;
  padding: 5px 9px;
}
.almora-comment-form textarea {
  display: block;
  width: 100%;
  min-height: 95px;
  margin: 10px 0;
  resize: vertical;
}
.almora-comment-form button {
  width: 100%;
}
</style>

<script>
(() => {
  const originalObra = window.obra;

  if (typeof originalObra !== 'function') {
    console.error('ALMORA: função obra não encontrada.');
    return;
  }

  const mountId = 'almora-work-comments';

  async function loadWorkComments(workId) {
    const mount = document.getElementById(mountId);
    if (!mount) return;

    mount.innerHTML = '<div class="empty">Carregando comentários...</div>';

    try {
  
        const { data, error } = await almoraDB
  .from('comments')
  .select('id,user_id,work_id,body,created_at,updated_at,is_pinned')
  .eq('work_id', workId)
  .is('chapter_id', null)
  .order('is_pinned', { ascending: false })
  .order('created_at', { ascending: true });
      
      if (error) throw error;
      if (!document.getElementById(mountId)) return;

      const ids = [...new Set((data || []).map(c => c.user_id))];
      let profiles = {};

      if (ids.length) {
        const result = await almoraDB
          .from('profiles')
          .select('id,username,display_name,avatar_url')
          .in('id', ids);

        if (result.error) throw result.error;

        (result.data || []).forEach(p => {
          profiles[p.id] = p;
        });
      }

      const comments = (data || []).map(c => {
        const p = profiles[c.user_id] || {};
        const name = p.display_name || p.username || 'Leitor(a)';
        const date = new Date(c.created_at).toLocaleString('pt-BR');
        const own = user && user.id === c.user_id;

        return `
          <article class="almora-comment"
  data-comment-id="${c.id}"
  data-work-id="${workId}"
  data-comment-type="work"
  data-is-pinned="${c.is_pinned ? 'true' : 'false'}">
  <div class="almora-comment-head">
    <a class="almora-comment-author"
       href="#perfil/${c.user_id}">
      ${p.avatar_url ? `
        <img class="almora-comment-avatar"
             src="${esc(p.avatar_url)}"
             alt=""
             onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
      ` : ''}
      <span class="almora-comment-avatar-fallback"
            style="display:${p.avatar_url ? 'none' : 'grid'}">
        👤
      </span>
      <span>${esc(name)}</span>
    </a>
    <span class="almora-comment-date">${esc(date)}</span>
  </div>

            <div class="almora-comment-body">${esc(c.body)}</div>

            <div class="almora-comment-actions">
              ${own ? `
                <button class="g"
                  onclick="almoraEditComment('${c.id}','${workId}')">
                  Editar
                </button>
                <button class="d"
                  onclick="almoraDeleteComment('${c.id}','${workId}')">
                  Excluir
                </button>
              ` : user ? `
                <button class="g"
                  onclick="almoraReportComment('${c.id}','${workId}')">
                  Denunciar
                </button>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');

      mount.innerHTML = `
        <h2>Comentários (${data.length})</h2>
        ${comments || '<div class="empty">Ainda não há comentários. Seja o primeiro!</div>'}

        ${user ? `
          <form class="almora-comment-form"
            onsubmit="event.preventDefault();almoraSubmitComment('${workId}')">
            <label for="almora-comment-body">
              Deixe seu comentário
            </label>
            <textarea id="almora-comment-body"
              maxlength="2000"
              required
              placeholder="O que você achou desta obra?"></textarea>
            <button type="submit">Publicar comentário</button>
          </form>
        ` : `
          <div class="empty">
            <a href="#conta" style="color:var(--ac)">
              Entre na sua conta
            </a>
            para comentar.
          </div>
        `}
      `;
    } catch (error) {
      console.error('Erro nos comentários:', error);
      const target = document.getElementById(mountId);
      if (target) {
        target.innerHTML =
          '<div class="empty">Não foi possível carregar os comentários.</div>';
      }
    }
  }

  window.almoraSubmitComment = async function(workId) {
    if (!user) return toast('Entre na sua conta para comentar.');

    const field = document.getElementById('almora-comment-body');
    const body = field?.value.trim();

    if (!body) return toast('Escreva um comentário.');

    try {
      const { error } = await almoraDB
        .from('comments')
        .insert({
          user_id: user.id,
          work_id: workId,
          chapter_id: null,
          body
        });

      if (error) throw error;

      toast('Comentário publicado!');
      await loadWorkComments(workId);
    } catch (error) {
      toast('Erro ao publicar comentário: ' + error.message);
    }
  };

  window.almoraEditComment = async function(id, workId) {
    const { data, error } = await almoraDB
      .from('comments')
      .select('body')
      .eq('id', id)
      .single();

    if (error) return toast('Não foi possível abrir o comentário.');

    const body = prompt('Edite seu comentário:', data.body);
    if (body === null) return;
    if (!body.trim()) return toast('O comentário não pode ficar vazio.');

    try {
      const result = await almoraDB
        .from('comments')
        .update({
          body: body.trim(),
          updated_at: new Date().toISOString()
        })
        .eq('id', id);

      if (result.error) throw result.error;

      toast('Comentário atualizado!');
      await loadWorkComments(workId);
    } catch (error) {
      toast('Erro ao editar: ' + error.message);
    }
  };

  window.almoraDeleteComment = async function(id, workId) {
    if (!confirm('Deseja excluir este comentário?')) return;

    try {
      const { error } = await almoraDB
        .from('comments')
        .delete()
        .eq('id', id);

      if (error) throw error;

      toast('Comentário excluído.');
      await loadWorkComments(workId);
    } catch (error) {
      toast('Erro ao excluir: ' + error.message);
    }
  };

  window.almoraReportComment = async function(id, workId) {
    if (!user) return toast('Entre na sua conta para denunciar.');

    const reason = prompt(
      'Motivo da denúncia:\n' +

<script>
(() => {
  let renderTimer;

  async function loadChapterComments(workId, chapterId) {
    const mount = document.getElementById('almora-chapter-comments');
    if (!mount) return;

    mount.innerHTML = '<div class="empty">Carregando comentários...</div>';

    try {
      const { data, error } = await almoraDB
        .from('comments')
        .select('id,user_id,body,created_at,is_pinned')
        .eq('work_id', workId)
        .eq('chapter_id', chapterId)
        .order('is_pinned', { ascending: false })
.order('created_at', { ascending: true });

      if (error) throw error;
      if (!document.getElementById('almora-chapter-comments')) return;

      const ids = [...new Set((data || []).map(c => c.user_id))];
      const profiles = {};

      if (ids.length) {
        const result = await almoraDB
  .from('profiles')
  .select('id,username,display_name,avatar_url')
  .in('id', ids);

        if (result.error) throw result.error;
        (result.data || []).forEach(p => profiles[p.id] = p);
      }

      const comments = (data || []).map(c => {
        const p = profiles[c.user_id] || {};
        const name = p.display_name || p.username || 'Leitor(a)';
        const date = new Date(c.created_at).toLocaleString('pt-BR');
        const own = user && user.id === c.user_id;

        return `
          <article class="almora-chapter-comment"
  data-comment-id="${c.id}"
  data-work-id="${workId}"
  data-chapter-id="${chapterId}"
  data-comment-type="chapter"
  data-is-pinned="${c.is_pinned ? 'true' : 'false'}">
            <div class="almora-chapter-comment-head">
              <a class="almora-chapter-comment-author"
   href="#perfil/${c.user_id}">
  ${p.avatar_url ? `
    <img class="almora-comment-avatar"
         src="${esc(p.avatar_url)}"
         alt=""
         onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
  ` : ''}
  <span class="almora-comment-avatar-fallback"
        style="display:${p.avatar_url ? 'none' : 'grid'}">
    👤
  </span>
  <span>${esc(name)}</span>
</a>
              <span class="almora-chapter-comment-date">
                ${esc(date)}
              </span>
            </div>

            <div class="almora-chapter-comment-body">
              ${esc(c.body)}
            </div>

            <div class="almora-chapter-comment-actions">
              ${own ? `
                <button class="g"
                  onclick="almoraEditChapterComment('${c.id}','${workId}','${chapterId}')">
                  Editar
                </button>
                <button class="d"
                  onclick="almoraDeleteChapterComment('${c.id}','${workId}','${chapterId}')">
                  Excluir
                </button>
              ` : user ? `
                <button class="g"
                  onclick="almoraReportChapterComment('${c.id}','${workId}')">
                  Denunciar
                </button>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');

      mount.innerHTML = `
        <h2>Comentários deste capítulo (${data.length})</h2>
        ${comments || '<div class="empty">Ainda não há comentários neste capítulo.</div>'}

        ${user ? `
          <form class="almora-chapter-comment-form"
            onsubmit="event.preventDefault();almoraSubmitChapterComment('${workId}','${chapterId}')">
            <label for="almora-chapter-comment-body">
              Comente este capítulo
            </label>
            <textarea id="almora-chapter-comment-body"
              maxlength="2000"
              required
              placeholder="O que você achou deste capítulo?"></textarea>
            <button type="submit">Publicar comentário</button>
          </form>
        ` : `
          <div class="empty">
            <a href="#conta" style="color:var(--ac)">
              Entre na sua conta
            </a> para comentar.
          </div>
        `}
      `;
    } catch (error) {
      console.error('Erro nos comentários do capítulo:', error);
      const target = document.getElementById('almora-chapter-comments');
      if (target) {
        target.innerHTML =
          '<div class="empty">Não foi possível carregar os comentários.</div>';
      }
    }
  }

  window.almoraSubmitChapterComment = async function(workId, chapterId) {
    if (!user) return toast('Entre na sua conta para comentar.');

    const field = document.getElementById('almora-chapter-comment-body');
    const body = field?.value.trim();

    if (!body) return toast('Escreva um comentário.');

    try {
      const { error } = await almoraDB
        .from('comments')
        .insert({
          user_id: user.id,
          work_id: workId,
          chapter_id: chapterId,
          body
        });

      if (error) throw error;

      toast('Comentário publicado!');
      await loadChapterComments(workId, chapterId);
    } catch (error) {
      toast('Erro ao publicar: ' + error.message);
    }
  };

  window.almoraEditChapterComment = async function(id, workId, chapterId) {
    const { data, error } = await almoraDB
      .from('comments')
      .select('body')
      .eq('id', id)
      .single();

    if (error) return toast('Não foi possível abrir o comentário.');

    const body = prompt('Edite seu comentário:', data.body);

    if (body === null) return;
    if (!body.trim()) return toast('O comentário não pode ficar vazio.');

    try {
      const result = await almoraDB
        .from('comments')
        .update({
          body: body.trim(),
          updated_at: new Date().toISOString()
        })
        .eq('id', id);

      if (result.error) throw result.error;

      toast('Comentário atualizado!');
      await loadChapterComments(workId, chapterId);
    } catch (error) {
      toast('Erro ao editar: ' + error.message);
    }
  };

  window.almoraDeleteChapterComment = async function(id, workId, chapterId) {
    if (!confirm('Deseja excluir este comentário?')) return;

    try {
      const { error } = await almoraDB
        .from('comments')
        .delete()
        .eq('id', id);

      if (error) throw error;

      toast('Comentário excluído.');
      await loadChapterComments(workId, chapterId);
    } catch (error) {
      toast('Erro ao excluir: ' + error.message);
    }
  };

  window.almoraReportChapterComment = async function(id, workId) {
    if (!user) return toast('Entre na sua conta para denunciar.');

    const reason = prompt(
      'Motivo da denúncia:\n1 - Ofensa ou assédio\n2 - Discurso de ódio\n3 - Spam\n4 - Spoiler\n5 - Outro'
    );

    if (!reason?.trim()) return;

    const details = prompt('Detalhes adicionais (opcional):') || '';

    try {
      const { error } = await almoraDB
        .from('reports')
        .insert({
          reporter_id: user.id,
          comment_id: id,
          work_id: workId,
          reason: reason.trim(),
          details: details.trim() || null
        });

      if (error) throw error;

      toast('Denúncia enviada para análise.');
    } catch (error) {
      toast('Erro ao denunciar: ' + error.message);
    }
  };

  const originalRender = window.ren;
  if (typeof originalRender !== 'function') return;

  window.ren = function(...args) {
    originalRender.apply(this, args);

    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
      const [route, workId, chapterNumber] =
        location.hash.slice(1).split('/');

      if (route !== 'ler' || !workId || !chapterNumber) return;

      const work = W(workId);
      const chapter = work?.chapters.find(
        c => String(c.n) === String(chapterNumber)
      );

      if (!chapter?.id) return;

      const app = document.getElementById('app');
      if (!app) return;

      document.getElementById('almora-chapter-comments')?.remove();

      const section = document.createElement('section');
      section.id = 'almora-chapter-comments';
      section.className = 'almora-chapter-comments';
      section.innerHTML =
        '<div class="empty">Carregando comentários...</div>';

      app.appendChild(section);
      loadChapterComments(workId, chapter.id);
    }, 380);
  };
})();
</script>
