<title>ALMORA — Where every story finds a home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#121214;--sf:#1e1e22;--sf2:#2a2a30;--tx:#f2eefc;--mu:#9d98b0;--ac:#b13df5;--ac2:#4b2bc4;--lv:#e2d9fa;--bd:#33333b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2fd;--sf:#fff;--sf2:#ece5fa;--tx:#1b1528;--mu:#6c6482;--bd:#d9cff0}}
:root[data-theme="light"]{--bg:#f6f2fd;--sf:#fff;--sf2:#ece5fa;--tx:#1b1528;--mu:#6c6482;--bd:#d9cff0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--bg);
  border-bottom:1px solid var(--bd);
  padding:10px 14px;
  display:grid;
  grid-template-columns:max-content minmax(0,1fr) auto auto;
  grid-template-areas:
    "logo search acc theme"
    "nav nav nav nav";

  align-items:center;
}

.logo{
  grid-area:logo;
  font:700 26px Fredoka,sans-serif;
  color:var(--ac2);

  align-items:center;

}

.logo svg{width:30px;height:28px;margin:0 1px}

#q{
  grid-area:search;
  width:100%;
  min-width:0;
}

#acc{grid-area:acc}
#th{grid-area:theme}

nav{
  grid-area:nav;
  display:flex;
  gap:4px;
  overflow-x:auto;
  width:100%;
  min-width:0;
  padding-bottom:3px;
  white-space:nowrap;
  scrollbar-width:thin;
  flex:none;
}

nav a{
  padding:6px 12px;
  border-radius:99px;
  color:var(--mu);
  white-space:nowrap;
  font-weight:600;

nav a.on{background:var(--ac2);color:#fff}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
button{cursor:pointer;background:var(--ac2);border:0;color:#fff;font-weight:600}
button.g{background:var(--sf2);color:var(--tx)}button.d{background:#a3243b}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:22px 0 10px;border-left:4px solid var(--ac);padding-left:10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:block;min-width:130px}.row .card{width:130px}
.cv{aspect-ratio:2/3;border-radius:12px;background:var(--sf2) center/cover;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.cv b{font:700 40px Fredoka;color:#fff;text-shadow:0 2px 6px #000;padding:0 6px}
.cv i{position:absolute;top:6px;right:6px;background:#000a;color:#fff;font-style:normal;font-size:12px;padding:2px 7px;border-radius:99px}
.t{margin:6px 0 2px;font-weight:600;font-size:14px;line-height:1.2}
.ch{display:flex;justify-content:space-between;background:var(--sf);border-radius:8px;padding:6px 9px;margin-top:4px;font-size:13px}
.ch span{color:var(--mu)}.new{color:#ff4d6d;font-size:11px;font-weight:700}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.box label{display:block;margin:8px 0 3px;color:var(--mu);font-size:13px}
.box input,.box select,.box textarea{width:100%}
.hero{display:flex;gap:16px;flex-wrap:wrap}.hero .cv{width:170px}.hero>div:last-child{flex:1;min-width:230px}
.pill{display:inline-block;background:var(--sf2);border-radius:99px;padding:2px 10px;font-size:12px;margin:0 4px 4px 0}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.stars span{font-size:24px;cursor:pointer;color:var(--bd)}.stars .on{color:#f5b73d}
.rd{max-width:var(--w,720px);margin:0 auto}.rd img{display:block;width:100%;min-height:200px;background:var(--sf)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:8px 0}
.th{display:flex;gap:8px;align-items:center;margin:6px 0}.th img{width:40px;height:56px;object-fit:cover;border-radius:6px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.sep{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:12px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs button.on{background:var(--ac2);color:#fff}
.lnk{background:none;border:0;color:var(--ac);padding:4px 0;text-decoration:underline;font-weight:400}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac2);color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
footer{text-align:center;color:var(--mu);padding:30px 14px;font-size:13px}

<header>
<a class="logo" href="#home" aria-label="ALMORA">Alm<svg viewBox="0 0 100 92"><path d="M8 8l32 14c14-5 26-5 40 0l12-14 4 40c-2 20-14 34-34 40-24-3-40-18-46-38z" fill="#050508" transform="translate(-2 0)"/><path d="M50 36l4 9h10l-8 6 3 10-9-6-9 6 3-10-8-6h10z" fill="#e2d9fa" transform="translate(-6 -2) scale(.9)"/><path d="M62 38c10-5 18-3 20 0-4 12-12 18-20 16z" fill="#b13df5"/></svg>ra</a>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={works:[],prog:{},lib:{},fav:{},rate:{},pin:null},unlocked=false,draft=[];
try{Object.assign(S,JSON.parse(localStorage.getItem('almora')||'{}'))}catch(e){}

const save=()=>{
  try{
    const personalData={
      prog:S.prog||{},
      lib:S.lib||{},
      fav:S.fav||{},
      rate:S.rate||{}
    };
    localStorage.setItem('almora',JSON.stringify(personalData));
    return true;
  }catch(e){
    toast('Não foi possível salvar seus dados pessoais.');
    return false;
  }
};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const W=id=>S.works.find(w=>w.id===id);
const last=w=>w.chapters.length?Math.max(...w.chapters.map(c=>c.date)):w.created;
const ago=d=>{const h=(Date.now()-d)/36e5;return h<1?'agora':h<24?Math.floor(h)+' h atrás':h<48?'1 dia atrás':h<720?Math.floor(h/24)+' dias atrás':new Date(d).toLocaleDateString('pt-BR')};
const cover=w=>w.cover?`style="background-image:url(${w.cover})"`:'';
const card=(w,extra='',rank)=>`<a class="card" href="#obra/${w.id}"><div class="cv" ${cover(w)}>${rank?`<b>${rank}</b>`:''}${w.reads?`<i>👁 ${w.reads}</i>`:''}</div><div class="t">${esc(w.title)}</div>${extra}</a>`;
const sec=(t,ws,fn)=>`<h2>${t}</h2>`+(ws.length?fn(ws):`<div class="empty">Nenhuma obra ainda.</div>`);
const rowOf=ws=>`<div class="row">${ws.map((w,i)=>card(w,'',i+1)).join('')}</div>`;
const gridOf=ws=>`<div class="grid">${ws.map(w=>card(w)).join('')}</div>`;
const upd=ws=>`<div class="grid">${ws.map(w=>card(w,[...w.chapters].sort((a,b)=>b.date-a.date).slice(0,2).map(c=>`<div class="ch"><b>Capítulo ${esc(c.n)}${Date.now()-c.date<864e5*3?' <span class="new">New</span>':''}</b><span>${ago(c.date)}</span></div>`).join(''))).join('')}</div>`;
const pub=()=>S.works.filter(w=>!w.archived);
function nav(r){$('#nav').innerHTML=[['home','Início'],['bl','BL'],['gl','GL'],['explorar','Explorar'],['atualizacoes','Atualizações'],['biblioteca','Minha biblioteca'],['studio','Studio']].map(([h,t])=>`<a href="#${h}" class="${r===h?'on':''}">${t}</a>`).join('')}
function home(){const p=pub(),byR=[...p].sort((a,b)=>(b.reads||0)-(a.reads||0)),byU=[...p].sort((a,b)=>last(b)-last(a));
return (p.length?'':`<div class="empty"><b>Bem-vindo(a) à ALMORA.</b><br>O catálogo está vazio. Cadastre a primeira obra no <a href="#studio" style="color:var(--ac)"><u>ALMORA STUDIO</u></a>.</div>`)+
sec('Popular hoje',byR.filter(w=>w.reads).slice(0,10),rowOf)+sec('Últimas atualizações',byU.filter(w=>w.chapters.length).slice(0,12),upd)+
sec('BL em destaque',byU.filter(w=>w.cat==='BL').slice(0,8),rowOf)+sec('GL em destaque',byU.filter(w=>w.cat==='GL').slice(0,8),rowOf)+
sec('Recém-adicionadas',[...p].sort((a,b)=>b.created-a.created).slice(0,8),rowOf)+sec('Concluídas',p.filter(w=>w.status==='Concluída').slice(0,8),rowOf)}
function catalog(cat,t){const q=($('#q').value||'').toLowerCase().trim();
const f=pub().filter(w=>(!cat||w.cat===cat)&&(!q||[w.title,w.alt,w.author,w.illus,w.genres,w.synopsis].join(' ').toLowerCase().includes(q)));
return `<h2>${t}</h2><div class="act"><select id="st" onchange="ren()"><option value="">Status: todos</option><option>Em andamento</option><option>Concluída</option><option>Pausada</option></select><select id="or" onchange="ren()"><option value="u">Atualizadas recentemente</option><option value="r">Mais lidas</option><option value="a">Ordem alfabética</option><option value="n">Mais recentes</option><option value="s">Melhor avaliadas</option></select></div>`+(()=>{const st=($('#st')||{}).value||'',or=($('#or')||{}).value||'u';
let l=f.filter(w=>!st||w.status===st);const rt=w=>(S.rate[w.id]||0);
l.sort(or==='a'?(a,b)=>a.title.localeCompare(b.title):or==='r'?(a,b)=>(b.reads||0)-(a.reads||0):or==='n'?(a,b)=>b.created-a.created:or==='s'?(a,b)=>rt(b)-rt(a):(a,b)=>last(b)-last(a));
return l.length?gridOf(l):`<div class="empty">Nada encontrado.</div>`})()}
function obra(id){const w=W(id);if(!w)return`<div class="empty">Obra não encontrada.</div>`;
const lp=S.prog[id],cs=[...w.chapters].sort((a,b)=>a.n-b.n),r=S.rate[id]||0,ls=S.lib[id]||'';
return `<div class="hero"><div class="cv" ${cover(w)}></div><div><h1 style="margin:0">${esc(w.title)}</h1><div style="color:var(--mu)">${esc(w.alt)}</div>
<div style="margin:8px 0"><span class="pill">${w.cat}</span><span class="pill">${esc(w.status)}</span><span class="pill">${esc(w.age)}</span>${(w.genres||'').split(',').filter(x=>x.trim()).map(g=>`<span class="pill">${esc(g.trim())}</span>`).join('')}</div>
<div>Autor: ${esc(w.author||'—')} · Ilustrador: ${esc(w.illus||'—')}</div><div>${cs.length} capítulos · 👁 ${w.reads||0} leituras</div>
<div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=r?'on':''}" onclick="rate('${id}',${i})">★</span>`).join('')}</div>
<div class="act">${cs.length?`<button onclick="location.hash='#ler/${id}/${lp?lp.n:cs[0].n}'">${lp?'Continuar lendo (cap. '+esc(lp.n)+')':'Começar a ler'}</button>`:''}
<button class="g" onclick="fav('${id}')">${S.fav[id]?'♥ Favorita':'♡ Favoritar'}</button>
<select onchange="lib('${id}',this.value)"><option value="">+ Biblioteca</option>${['Lendo','Quero ler','Concluídas','Abandonadas','Pausadas'].map(x=>`<option ${ls===x?'selected':''}>${x}</option>`).join('')}</select>
<button class="g" onclick="share('${id}')">Compartilhar</button></div></div></div>
<h2>Sinopse</h2><p>${esc(w.synopsis||'Sem sinopse.')}</p>
<h2>Capítulos</h2>${cs.length?[...cs].reverse().map(c=>`<a class="ch" href="#ler/${id}/${c.n}"><b>Capítulo ${esc(c.n)}${c.title?' — '+esc(c.title):''}</b><span>${ago(c.date)}${lp&&lp.read&&lp.read.includes(c.n)?' ✓':''}</span></a>`).join(''):'<div class="empty">Sem capítulos publicados.</div>'}`}
function rate(id,n){S.rate[id]=n;save();ren()}
function fav(id){S.fav[id]=!S.fav[id];save();ren()}
function lib(id,v){if(v)S.lib[id]=v;else delete S.lib[id];save();toast('Biblioteca atualizada')}
function share(id){const u=location.href.split('#')[0]+'#obra/'+id;navigator.clipboard?.writeText(u).then(()=>toast('Link copiado'),()=>toast(u))}
function biblio(){const L=['Lendo','Quero ler','Concluídas','Abandonadas','Pausadas'];
const fv=pub().filter(w=>S.fav[w.id]);return sec('Favoritas',fv,gridOf)+L.map(l=>sec(l,pub().filter(w=>S.lib[w.id]===l),gridOf)).join('')}
let obs;
function reader(id,n){const w=W(id),c=w&&w.chapters.find(c=>String(c.n)===n);if(!c)return`<div class="empty">Capítulo não encontrado.</div>`;
const cs=[...w.chapters].sort((a,b)=>a.n-b.n),i=cs.indexOf(c),p=S.prog[id]=S.prog[id]||{read:[]};
if(p.n!==c.n){w.reads=(w.reads||0)+1}p.n=c.n;if(!p.read.includes(c.n))p.read.push(c.n);save();
const nv=`<button class="g" ${i?`onclick="location.hash='#ler/${id}/${cs[i-1].n}'"`:'disabled'}>◀</button><button class="g" ${cs[i+1]?`onclick="location.hash='#ler/${id}/${cs[i+1].n}'"`:'disabled'}>▶</button>`;
setTimeout(()=>{obs?.disconnect();obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){S.prog[id].pg=+e.target.dataset.i;save()}}),{threshold:.6});document.querySelectorAll('.rd img').forEach(im=>obs.observe(im));const pg=p.pg;if(pg&&p.n===c.n&&pg>0)document.querySelector(`.rd img[data-i="${pg}"]`)?.scrollIntoView()},50);
return `<div class="bar"><a href="#obra/${id}"><button class="g">← ${esc(w.title)}</button></a>${nv}<span>Cap. ${esc(c.n)}</span><input type="range" min="360" max="1000" value="${parseInt(getComputedStyle(document.documentElement).getPropertyValue('--w'))||720}" oninput="document.documentElement.style.setProperty('--w',this.value+'px')" title="Largura"><button class="g" onclick="document.documentElement.requestFullscreen?.()">⛶</button></div>
<div class="rd">${c.pages.map((s,k)=>`<img data-i="${k}" loading="${k<3?'eager':'lazy'}" src="${s}" alt="Página ${k+1}" onerror="this.alt='Erro ao carregar a página ${k+1}'">`).join('')}</div><div class="bar" style="position:static;justify-content:center">${nv}</div>`}
/* CONTA / AUTH (Firebase Authentication) */
/* Cole aqui a config do seu app web no Firebase (Console > Configurações do projeto > Seus apps) */

let user=null,authMode='in';

const authErr=e=>{
  const msgs={
    'invalid_credentials':'E-mail ou senha incorretos.',
    'weak_password':'Senha fraca.',
    'email_exists':'Este e-mail já está cadastrado.',
    'user_already_exists':'Este e-mail já está cadastrado.',
    'over_email_send_rate_limit':'Muitas tentativas. Tente novamente mais tarde.'
  };
  return msgs[e.code]||msgs[e.message]||'Erro: '+(e.message||'Tente novamente.');
};

async function loadCatalog(){
  try{
    const [
      {data:works,error:worksError},
      {data:chapters,error:chaptersError},
      {data:pages,error:pagesError}
    ] = await Promise.all([
      almoraDB.from('works').select('*').order('created_at',{ascending:false}),
      almoraDB.from('chapters').select('*').order('chapter_number'),
      almoraDB.from('pages').select('*').order('page_number')
    ]);

    if(worksError)throw worksError;
    if(chaptersError)throw chaptersError;
    if(pagesError)throw pagesError;

    const oldWorks=S.works||[];
    const pageGroups={};

    pages.forEach(p=>{
      if(!pageGroups[p.chapter_id])pageGroups[p.chapter_id]=[];
      pageGroups[p.chapter_id].push(p);
    });

    const chapterGroups={};

    chapters.forEach(c=>{
      if(!chapterGroups[c.work_id])chapterGroups[c.work_id]=[];

      const chapterPages=(pageGroups[c.id]||[])
        .sort((a,b)=>a.page_number-b.page_number)
        .map(p=>p.image_url);

      chapterGroups[c.work_id].push({
        id:c.id,
        n:Number(c.chapter_number),
        title:c.title||'',
        date:new Date(c.created_at).getTime(),
        pages:chapterPages
      });
    });

    const remoteWorks=works.map(w=>{
      const old=oldWorks.find(x=>x.id===w.id);

      return {
        id:w.id,
        title:w.title,
        alt:w.alternative_title||'',
        cat:w.work_type,
        author:w.author_name||'',
        illus:w.illustrator||'',
        genres:(w.genre||[]).join(', '),
        age:w.age_rating,
        status:w.work_status||'Em andamento',
        rights:w.rights_holder||'',
        synopsis:w.synopsis||'',
        cover:w.cover_url||'',
        created:new Date(w.created_at).getTime(),
        reads:old?.reads||0,
        archived:old?.archived||false,
        chapters:chapterGroups[w.id]||[]
      };
    });

    const remoteIds=new Set(remoteWorks.map(w=>w.id));
    const localOnly=oldWorks.filter(w=>!remoteIds.has(w.id));

    S.works=[...remoteWorks,...localOnly];

  }catch(e){
    console.error('Erro ao carregar catálogo:',e);
    toast('Erro ao carregar catálogo: '+e.message);
  }
}

async function initAuth(){
  try{
    const {data,error}=await almoraDB.auth.getSession();
    if(error)throw error;

    user=data.session?.user||null;
    head();

    await loadCatalog();
    ren();

    almoraDB.auth.onAuthStateChange((event,session)=>{
      user=session?.user||null;
      head();

      if(event==='SIGNED_IN' || event==='SIGNED_OUT'){
        loadCatalog().then(()=>{
          ren();
        });
      }else if((location.hash.slice(1)||'home').split('/')[0]==='conta'){
        ren();
      }
    });

  }catch(e){
    toast('Falha ao iniciar: '+e.message);
    console.error(e);
  }
}

function head(){
  const nome=user?.user_metadata?.display_name||user?.email||'Conta';
  $('#acc').innerHTML=`<button class="g" type="button">${user?esc(nome.split(/[ @]/)[0]):'Entrar'}</button>`;
}

function conta(){
  if(user){
    const nome=user.user_metadata?.display_name||'Leitor(a)';
    return `<div class="box" style="max-width:420px;margin:30px auto">
      <h2 style="margin-top:0">Minha conta</h2>
      <p><b>${esc(nome)}</b><br>
      <span style="color:var(--mu)">${esc(user.email||'')}</span></p>
      <div class="act"><button class="d" onclick="out()">Sair</button></div>
    </div>`;
  }

  const up=authMode==='up';

  return `<div class="box" style="max-width:420px;margin:30px auto">
    <h2 style="margin-top:0">${up?'Criar conta':'Entrar'}</h2>
    <div class="tabs">
      <button class="${up?'g':'on'}" onclick="authMode='in';ren()">Entrar</button>
      <button class="${up?'on':'g'}" onclick="authMode='up';ren()">Cadastrar</button>
    </div>
    <div class="sep">ou com e-mail</div>
    <form onsubmit="event.preventDefault();mail()">
      ${up?`<label>Nome</label><input id="a_n" autocomplete="name">`:''}
      <label>E-mail</label>
      <input id="a_e" type="email" autocomplete="email" required>
      <label>Senha</label>
      <input id="a_p" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required>
      ${up?`<label>Confirmar senha</label><input id="a_p2" type="password" autocomplete="new-password" required>`:''}
      <div class="act"><button type="submit" style="flex:1">${up?'Criar conta':'Entrar'}</button></div>
    </form>
    ${up?'':`<button class="lnk" onclick="reset()">Esqueci minha senha</button>`}

      const path=`${user.id}/${id}/${Date.now()}-${i+1}.jpg`;

<script>
(() => {
  const box = document.querySelector('#toast');
  if (!box) return;

  let timer;
  let hideTimer;

  const types = {
    success: { icon: '✓', color: '#36c98f' },
    error:   { icon: '✕', color: '#ff657a' },
    warning: { icon: '⚠', color: '#f3bd55' },
    info:    { icon: 'ⓘ', color: '#b77aff' },
    loading: { icon: '◌', color: '#b77aff' }
  };

  function notify(message, type = 'info', duration = 3500) {
    const config = types[type] || types.info;

    clearTimeout(timer);
    clearTimeout(hideTimer);

    box.classList.remove('almora-hide', 'almora-show');

    const content = document.createElement('div');
    content.className = 'almora-message';

    const icon = document.createElement('span');
    icon.className = 'almora-icon';
    icon.textContent = config.icon;
    icon.style.color = config.color;

    const text = document.createElement('span');
    text.textContent = message;

    content.append(icon, text);
    box.replaceChildren(content);

    box.style.display = 'block';
    requestAnimationFrame(() => {
      box.classList.add('almora-show');
    });

    if (duration > 0) {
      timer = setTimeout(() => {
        box.classList.remove('almora-show');
        box.classList.add('almora-hide');

        hideTimer = setTimeout(() => {
          box.classList.remove('almora-hide');
        }, 350);
      }, duration);
    }
  }

  window.almoraNotify = notify;

  // Mantém compatibilidade com as chamadas antigas de toast()
  window.toast = (message) => {
    const text = String(message);
    const type = /erro|falha|não foi possível/i.test(text)
      ? 'error'
      : /sucesso|atualizada|copiado|bem-vindo|autorizado/i.test(text)
      ? 'success'
      : 'info';

    notify(text, type);
  };
})();
</script>

<script>
(() => {
  function prepareImages(root = document) {
    root.querySelectorAll('.cv').forEach(el => {
      const bg = getComputedStyle(el).backgroundImage;
      const match = bg.match(/url\(["']?(.*?)["']?\)/);

      if (!match) {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
        return;
      }

      if (el.dataset.almoraChecked === 'yes') return;
      el.dataset.almoraChecked = 'yes';
      el.classList.add('almora-cover-loading');

      const img = new Image();

      img.onload = () => {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
      };

      img.onerror = () => {
        el.classList.remove('almora-cover-loading');
        el.classList.add('almora-cover-ready');
      };

      img.src = match[1];
    });

    root.querySelectorAll('.rd img').forEach(img => {
      if (img.dataset.almoraChecked === 'yes') return;
      img.dataset.almoraChecked = 'yes';

      if (img.complete && img.naturalWidth > 0) {
        img.classList.add('almora-img-ready');
      } else {
        img.addEventListener('load', () => {
          img.classList.add('almora-img-ready');
        }, { once: true });

        img.addEventListener('error', () => {
          img.classList.add('almora-img-error');
        }, { once: true });
      }
    });
  }

  prepareImages();

  const app = document.querySelector('#app');

  if (app) {
    new MutationObserver(() => prepareImages(app))
      .observe(app, { childList: true, subtree: true });
  }
})();
</script>

  async function loadProfile(id) {
    const request = ++profileRequest;
    const app = $('#app');

    app.innerHTML = '<div class="empty">Carregando perfil...</div>';

    try {
      const { data, error } = await almoraDB
        .from('profiles')
        .select('id,username,display_name,avatar_url,bio,created_at')
        .eq('id', id)
        .maybeSingle();

      if (request !== profileRequest) return;
      if (error) throw error;

      if (!data) {
        app.innerHTML = '<div class="empty">Perfil não encontrado.</div>';
        return;
      }

      currentProfile = data;

      const own = user && user.id === data.id;
      const name = data.display_name || 'Leitor(a)';
      const username = data.username || 'leitor';
      const avatar = data.avatar_url || '';

      app.innerHTML = `

                  <span style="font-size:36px">♧</span>
                </div>`}

            <div class="almora-profile-info">
              <h1>${esc(name)}</h1>
              <div class="almora-username">

              </div>
              <div style="color:var(--mu);font-size:12px">

              </div>
            </div>
          </div>

          <div class="almora-bio">
            ${esc(data.bio || 'Este leitor ainda não escreveu uma biografia.')}

</button>
<button class="g" onclick="almoraOpenPrivacy()">
  Privacidade
</button>
<button class="g" onclick="out()">
  Sair da conta
</button>
            ` : ''}

            <button class="g"

            </button>
          </div>
        </section>

          <label>Biografia</label>
          <textarea id="profile_bio"
            rows="5"
            maxlength="300"
            placeholder="Conte um pouco sobre você...">${esc(currentProfile.bio || '')}</textarea>

          <div class="almora-profile-actions">
            <button type="submit">Salvar alterações</button>
            <button type="button" class="g"
              onclick="ren()">Cancelar</button>
          </div>
        </form>
      </section>
    `;
  };

  window.almoraSaveProfile = async function() {
    if (!user || !currentProfile ||
        currentProfile.id !== user.id) return;

    const name = $('#profile_name').value.trim();
    const avatar = $('#profile_avatar').value.trim();
    const bio = $('#profile_bio').value.trim();

    if (!name) return toast('Informe seu nome de exibição.');

    try {
      const { error } = await almoraDB
        .from('profiles')
        .update({
          display_name: name,
          avatar_url: avatar || null,
          bio: bio || null
        })
        .eq('id', user.id);

      if (error) throw error;

      toast('Perfil atualizado com sucesso!');
      await loadProfile(user.id);
    } catch (error) {
      toast('Erro ao atualizar perfil: ' + error.message);
    }
  };

  window.almoraShareProfile = function(id) {
    const url = location.origin + location.pathname + '#perfil/' + id;

    navigator.clipboard?.writeText(url)
      .then(() => toast('Link do perfil copiado!'))
      .catch(() => toast(url));
  };

  const oldRender = window.ren;

  window.ren = function(...args) {
    oldRender.apply(this, args);

    const [route, id] = location.hash.slice(1).split('/');

    if (route === 'perfil') {
      setTimeout(() => {
        const target = id || user?.id;

        if (!target) {
          $('#app').innerHTML =
            '<div class="empty">Entre na sua conta para acessar seu perfil. <a href="#conta">Entrar</a></div>';
          return;
        }

        loadProfile(target);
      }, 230);
    }

})();

    const mount = document.getElementById(mountId);

    mount.innerHTML = '<div class="empty">Carregando comentários...</div>';

    try {

      if (ids.length) {

          .from('profiles')

    if (!body) return toast('Escreva um comentário.');

    try {
      const { error } = await almoraDB
        .from('comments')
        .insert({
          user_id: user.id,

        .from('comments')
        .delete()

      toast('Comentário excluído.');
      await loadWorkComments(workId);
    } catch (error) {
      toast('Erro ao excluir: ' + error.message);

          Gerencie denúncias e comentários da comunidade.
        </p>

        <label for="almora-report-filter">Filtrar denúncias</label>
        <select id="almora-report-filter"
          onchange="almoraLoadReports()">
          <option value="pending">Pendentes</option>
          <option value="all">Todas</option>
          <option value="resolved">Analisadas</option>
          <option value="rejected">Rejeitadas</option>
        </select>

        <div id="almora-report-list">
          <div class="empty">Carregando denúncias...</div>
        </div>

        <button class="g" style="width:100%;margin-top:12px"
          onclick="almoraLoadReports()">
          Atualizar denúncias
        </button>
      </section>
    `;
  };

  async function verifyAdmin() {
    if (!user) return false;

    const { data, error } = await almoraDB
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (error) throw error;

    return ['admin', 'superadmin'].includes(data?.role);
  }

  window.almoraLoadReports = async function() {
    const mount = document.getElementById('almora-report-list');
    if (!mount) return;

    mount.innerHTML =
      '<div class="empty">Carregando denúncias...</div>';

    try {
      if (!await verifyAdmin()) {
        mount.innerHTML =
          '<div class="empty">Acesso restrito à administração.</div>';
        return;
      }

      const filter =
        document.getElementById('almora-report-filter')?.value || 'pending';

      let query = almoraDB
        .from('reports')
        .select('id,reporter_id,comment_id,work_id,reason,details,status,created_at')
        .order('created_at', { ascending: false });

      if (filter !== 'all') {
        query = query.eq('status', filter);
      }

      const { data: reports, error } = await query;
      if (error) throw error;

      if (!reports?.length) {
        mount.innerHTML =
          '<div class="empty">Nenhuma denúncia nesta categoria.</div>';
        return;
      }

      const commentIds = [...new Set(
        reports.map(r => r.comment_id).filter(Boolean)
      )];

      const workIds = [...new Set(
        reports.map(r => r.work_id).filter(Boolean)
      )];

      const profileIds = [...new Set(
        reports.map(r => r.reporter_id).filter(Boolean)
      )];

      const [commentResult, workResult, profileResult] =
        await Promise.all([
          commentIds.length
            ? almoraDB.from('comments')
                .select('id,body,user_id,status')
                .in('id', commentIds)
            : Promise.resolve({ data: [], error: null }),

          workIds.length
            ? almoraDB.from('works')
                .select('id,title')
                .in('id', workIds)
            : Promise.resolve({ data: [], error: null }),

          profileIds.length
            ? almoraDB.from('profiles')
                .select('id,username,display_name')
                .in('id', profileIds)
            : Promise.resolve({ data: [], error: null })
        ]);

      if (commentResult.error) throw commentResult.error;
      if (workResult.error) throw workResult.error;
      if (profileResult.error) throw profileResult.error;

      const comments = Object.fromEntries(
        (commentResult.data || []).map(c => [c.id, c])
      );

      const works = Object.fromEntries(
        (workResult.data || []).map(w => [w.id, w])
      );

      const profiles = Object.fromEntries(
        (profileResult.data || []).map(p => [p.id, p])
      );

      mount.innerHTML = reports.map(report => {
        const comment = comments[report.comment_id];
        const work = works[report.work_id];
        const reporter = profiles[report.reporter_id];

        const reporterName =
          reporter?.display_name ||
          reporter?.username ||
          'Leitor(a)';

        const date = new Date(report.created_at)
          .toLocaleString('pt-BR');

        const pending = report.status === 'pending';

        return `
          <article class="almora-mod-card">
            <div class="almora-mod-head">
              <b>${esc(work?.title || 'Obra não identificada')}</b>
              <span class="almora-mod-status">
                ${esc(statusName(report.status))}
              </span>
            </div>

            <div class="almora-mod-meta">
              Denunciado em ${esc(date)}
            </div>

            <div class="almora-mod-meta">
              Denunciante:
              <a href="#perfil/${report.reporter_id}"
                style="color:var(--ac)">
                ${esc(reporterName)}
              </a>
            </div>

            <div class="almora-mod-meta">
              Motivo: <b>${esc(reasonName(report.reason))}</b>
            </div>

            ${report.details ? `
              <div class="almora-mod-meta">
                Detalhes da denúncia:
              </div>
              <div class="almora-mod-body">
                ${esc(report.details)}
              </div>
            ` : ''}

            <div class="almora-mod-meta">
              Comentário denunciado:
            </div>

            <div class="almora-mod-body">
              ${comment
                ? esc(comment.body)
                : 'O comentário não está mais disponível.'}
            </div>

            ${comment ? `
              <div class="almora-mod-meta">
                Situação do comentário:
                ${esc(comment.status)}
              </div>
            ` : ''}

            ${pending ? `
              <div class="almora-mod-actions">
                ${comment ? `
                  <button class="d"
                    onclick="almoraModerateReport('${report.id}','remove')">
                    Remover comentário
                  </button>
                  <button class="g"
                    onclick="almoraModerateReport('${report.id}','keep')">
                    Manter comentário
                  </button>
                ` : ''}
                <button class="g"
                  onclick="almoraModerateReport('${report.id}','reject')">
                  Rejeitar denúncia
                </button>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');

    } catch (error) {
      console.error('Erro na central de moderação:', error);
      mount.innerHTML =
        '<div class="empty">Não foi possível carregar as denúncias: ' +
        esc(error.message) + '</div>';
    }
  };

  window.almoraModerateReport = async function(reportId, action) {
    try {
      if (!await verifyAdmin()) {
        return toast('Acesso restrito à administração.');
      }

      const messages = {
        remove: 'Remover o comentário e aprovar a denúncia?',
        keep: 'Manter o comentário e encerrar a denúncia?',
        reject: 'Rejeitar esta denúncia?'
      };

      if (!confirm(messages[action] || 'Confirmar ação?')) return;

      const { data: report, error: reportError } = await almoraDB
        .from('reports')
        .select('id,comment_id')
        .eq('id', reportId)
        .single();

      if (reportError) throw reportError;

      if (action === 'remove' && report.comment_id) {
        const { error } = await almoraDB
          .from('comments')
          .update({
            status: 'hidden',
            updated_at: new Date().toISOString()
          })
          .eq('id', report.comment_id);

        if (error) throw error;
      }

      const newStatus =
        action === 'reject' ? 'rejected' : 'resolved';

      const { error: updateError } = await almoraDB
        .from('reports')
        .update({ status: newStatus })
        .eq('id', reportId);

      if (updateError) throw updateError;

      toast(
        action === 'remove'
          ? 'Comentário removido da visualização pública.'
          : action === 'keep'
            ? 'Denúncia encerrada. Comentário mantido.'
            : 'Denúncia rejeitada.'
      );

      await window.almoraLoadReports();

    } catch (error) {
      console.error('Erro ao moderar denúncia:', error);
      toast('Erro na moderação: ' + error.message);
    }
  };

  const oldRender = window.ren;

  window.ren = function(...args) {
    oldRender.apply(this, args);

    if (location.hash.slice(1).split('/')[0] === 'studio' && unlocked) {
      setTimeout(() => {
        if (document.getElementById('almora-report-list')) {
          window.almoraLoadReports();
        }
      }, 250);
    }
  };
})();
</script>

<script>
(() => {
  let adminStatus = false;

  const originalNav = window.nav;
  const originalStudio = window.studio;

  // Mostra Studio somente para administradores
  window.nav = function(route) {
    originalNav(route);

    const links = document.querySelectorAll('#nav a');
    links.forEach(link => {
      if (link.getAttribute('href') === '#studio') {
        link.remove();
      }
    });

    if (adminStatus) {
      const link = document.createElement('a');
      link.href = '#studio';
      link.textContent = 'Studio';
      link.className = route === 'studio' ? 'on' : '';
      document.querySelector('#nav').appendChild(link);
    }
  };

  // Bloqueia acesso direto à rota Studio
  window.studio = function(...args) {
    if (!adminStatus) {
      return `
        <div class="box" style="max-width:380px;margin:30px auto">
          <h2>Acesso restrito</h2>
          <p>Esta área é exclusiva da administração da ALMORA.</p>
          <a href="#home"><button>Voltar ao início</button></a>
        </div>
      `;
    }

    return originalStudio.apply(this, args);
  };

  // Consulta a autorização diretamente no Supabase
  async function checkAdmin() {
    adminStatus = false;

    if (typeof user === 'undefined' || !user) {
      window.ren();
      return;
    }

    const { data, error } = await almoraDB.rpc('is_admin');

    adminStatus = !error && data === true;

    window.ren();
  }

  // Verifica ao iniciar e quando a autenticação mudar
  almoraDB.auth.onAuthStateChange(() => {
    setTimeout(checkAdmin, 0);
  });

  checkAdmin();
})();
</script>

<script>
(() => {
  let currentRatingWork = null;
  let currentRatingRequest = 0;

  async function loadWorkRating(workId) {
    const request = ++currentRatingRequest;
    currentRatingWork = workId;

    const hero = document.querySelector('#app .hero');
    if (!hero) return;

    document.querySelector('#almora-rating')?.remove();

    hero.insertAdjacentHTML('afterend', `
      <section class="almora-rating" id="almora-rating">
        <b>Avaliações da comunidade</b>
        <div class="almora-rating-info">Carregando avaliações...</div>
      </section>
    `);

    try {
      const {data: ratings, error} = await almoraDB
        .from('ratings')
        .select('score')
        .eq('work_id', workId);

      if (error) throw error;
      if (request !== currentRatingRequest) return;

      const scores = ratings || [];
      const total = scores.length;
      const average = total
        ? scores.reduce((sum, item) => sum + Number(item.score), 0) / total
        : 0;

      let myScore = 0;

      if (user) {
        const {data, error: ownError} = await almoraDB
          .from('ratings')
          .select('score')
          .eq('work_id', workId)
          .eq('user_id', user.id)
          .maybeSingle();

        if (ownError) throw ownError;
        myScore = Number(data?.score || 0);
      }

      if (request !== currentRatingRequest) return;

      renderRating(workId, average, total, myScore);

    } catch (error) {
      const section = document.querySelector('#almora-rating');
      if (section) {
        section.innerHTML = `
          <b>Avaliações da comunidade</b>
          <p class="almora-rating-info">
            Não foi possível carregar as avaliações:
            ${esc(error.message)}
          </p>
        `;
      }
    }
  }

  function renderRating(workId, average, total, myScore) {
    const section = document.querySelector('#almora-rating');
    if (!section) return;

    section.innerHTML = `
      <b>Avaliações da comunidade</b>

      <div class="almora-rating-average">
        ${average.toFixed(1)} ★
      </div>

      <div class="almora-rating-info">
        ${total} ${total === 1 ? 'avaliação' : 'avaliações'}
      </div>

      <div class="almora-rating-info" style="margin-top:14px">
        ${user
          ? (myScore
              ? 'Sua avaliação atual: ' + myScore + '/5'
              : 'Qual nota você daria para esta obra?')
          : 'Entre na sua conta para avaliar esta obra.'}
      </div>

      <div class="almora-rating-stars">
        ${[1,2,3,4,5].map(n => `
          <button
            type="button"
            class="${n <= myScore ? 'active' : ''}"
            aria-label="${n} estrelas"
            ${user ? `onclick="almoraRateWork('${workId}',${n})"` : ''}
          >★</button>
        `).join('')}
      </div>

      <div class="almora-rating-info">
        ${myScore
          ? 'Você pode alterar sua avaliação quando quiser.'
          : 'Sua avaliação ajuda outros leitores a descobrir histórias.'}
      </div>
    `;
  }

  window.almoraRateWork = async function(workId, score) {
    if (!user) {
      toast('Entre na sua conta para avaliar.');
      location.hash = '#conta';
      return;
    }

    if (score < 1 || score > 5) return;

    const section = document.querySelector('#almora-rating');
    if (section) {
      section.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    try {
      const {data: existing, error: searchError} = await almoraDB
        .from('ratings')
        .select('score')
        .eq('work_id', workId)
        .eq('user_id', user.id)
        .maybeSingle();

      if (searchError) throw searchError;

      let result;

      if (existing) {
        result = await almoraDB
          .from('ratings')
          .update({score:score})
          .eq('work_id', workId)
          .eq('user_id', user.id);
      } else {
        result = await almoraDB
          .from('ratings')
          .insert({
            work_id:workId,
            user_id:user.id,
            score:score
          });
      }

      if (result.error) throw result.error;

      toast('Avaliação salva com sucesso!');
      await loadWorkRating(workId);

    } catch (error) {
      toast('Erro ao salvar avaliação: ' + error.message);
      await loadWorkRating(workId);
    }
  };

  const originalRen = window.ren;

  window.ren = function(...args) {
    originalRen.apply(this, args);

    const [route, workId] = location.hash
      .slice(1)
      .split('/');

    if (route === 'obra' && workId) {
      setTimeout(() => {
        if (location.hash === '#obra/' + workId) {
          loadWorkRating(workId);
        }
      }, 250);
    } else {
      currentRatingRequest++;
      currentRatingWork = null;
    }
  };

  if (location.hash.startsWith('#obra/')) {
    const id = location.hash.slice(6).split('/')[0];
    setTimeout(() => loadWorkRating(id), 500);
  }
})();
</script>

window.almoraSavePrivacy = async function() {

  };

  try {
    const { data, error } = await almoraDB
      .from('profile_privacy')
      .upsert(settings, { onConflict: 'user_id' })
      .select('user_id, profile_public, library_public, history_public, stats_public')
      .single();

    if (error) throw error;
    if (!data || data.user_id !== user.id) {
      throw new Error('O banco não confirmou a gravação.');
    }

    toast('Preferências salvas e confirmadas!');
    location.hash = '#perfil';

  } catch (error) {
    console.error('Erro ao salvar privacidade:', error);
    toast('Erro ao salvar: ' + error.message);
  }
};
              

  if (location.hash.startsWith('#perfil')) {
    setTimeout(() => window.ren(), 1000);
  }
})();
</script>
  
</body>
</html>
