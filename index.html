<script>
(() => {
  const originalStudio = window.studio;

  if (typeof originalStudio !== 'function') {
    console.error('ALMORA: função Studio não encontrada.');
    return;
  }

  const statusName = status => ({
    pending: 'Pendente',
    resolved: 'Analisada',
    rejected: 'Rejeitada'
  }[status] || status || 'Pendente');

  const reasonName = reason => ({
    '1': 'Ofensa ou assédio',
    '2': 'Discurso de ódio',
    '3': 'Spam',
    '4': 'Spoiler',
    '5': 'Outro'
  }[String(reason)] || reason || 'Não informado');

  window.studio = function(...args) {
    const html = originalStudio.apply(this, args);

    if (!unlocked) return html;

    return html + `
      <section class="almora-mod" id="almora-moderation" style="display:none">
        <h2>Central de moderação</h2>
        <p style="color:var(--mu)">
          Gerencie denúncias e comentários da comunidade.
        </p>

        <label for="almora-report-filter">Filtrar denúncias</label>
        <select id="almora-report-filter"
          onchange="almoraLoadReports()">
          <option value="pending">Pendentes</option>
          <option value="all">Todas</option>
          <option value="resolved">Analisadas</option>
          <option value="rejected">Rejeitadas</option>
        </select>

        <div id="almora-report-list">
          <div class="empty">Carregando denúncias...</div>
        </div>

        <button class="g" style="width:100%;margin-top:12px"
          onclick="almoraLoadReports()">
          Atualizar denúncias
        </button>
      </section>
    `;
  };

  async function verifyAdmin() {
    if (!user) return false;

    const { data, error } = await almoraDB.rpc('is_admin');

    if (error) throw error;

    return data === true;
  }

  window.almoraLoadReports = async function() {
    const mount = document.getElementById('almora-report-list');
    if (!mount) return;

    mount.innerHTML =
      '<div class="empty">Carregando denúncias...</div>';

    try {
      if (!await verifyAdmin()) {
        mount.innerHTML =
          '<div class="empty">Acesso restrito à administração.</div>';
        return;
      }

      const filter =
        document.getElementById('almora-report-filter')?.value || 'pending';

      let query = almoraDB
        .from('reports')
        .select('id,reporter_id,comment_id,work_id,reason,details,status,created_at')
        .order('created_at', { ascending: false });

      if (filter !== 'all') {
        query = query.eq('status', filter);
      }

      const { data: reports, error } = await query;
      if (error) throw error;

      if (!reports?.length) {
        mount.innerHTML =
          '<div class="empty">Nenhuma denúncia nesta categoria.</div>';
        return;
      }

      const commentIds = [...new Set(
        reports.map(r => r.comment_id).filter(Boolean)
      )];

      const workIds = [...new Set(
        reports.map(r => r.work_id).filter(Boolean)
      )];

      const profileIds = [...new Set(
        reports.map(r => r.reporter_id).filter(Boolean)
      )];

      const [commentResult, workResult, profileResult] =
        await Promise.all([
          commentIds.length
            ? almoraDB.from('comments')
                .select('id,body,user_id,status')
                .in('id', commentIds)
            : Promise.resolve({ data: [], error: null }),

          workIds.length
            ? almoraDB.from('works')
                .select('id,title')
                .in('id', workIds)
            : Promise.resolve({ data: [], error: null }),

          profileIds.length
            ? almoraDB.from('profiles')
                .select('id,username,display_name')
                .in('id', profileIds)
            : Promise.resolve({ data: [], error: null })
        ]);

      if (commentResult.error) throw commentResult.error;
      if (workResult.error) throw workResult.error;
      if (profileResult.error) throw profileResult.error;

      const comments = Object.fromEntries(
        (commentResult.data || []).map(c => [c.id, c])
      );

      const works = Object.fromEntries(
        (workResult.data || []).map(w => [w.id, w])
      );

      const profiles = Object.fromEntries(
        (profileResult.data || []).map(p => [p.id, p])
      );

      mount.innerHTML = reports.map(report => {
        const comment = comments[report.comment_id];
        const work = works[report.work_id];
        const reporter = profiles[report.reporter_id];

        const reporterName =
          reporter?.display_name ||
          reporter?.username ||
          'Leitor(a)';

        const date = new Date(report.created_at)
          .toLocaleString('pt-BR');

        const pending = report.status === 'pending';

        return `
          <article class="almora-mod-card">
            <div class="almora-mod-head">
              <b>${esc(work?.title || 'Obra não identificada')}</b>
              <span class="almora-mod-status">
                ${esc(statusName(report.status))}
              </span>
            </div>

            <div class="almora-mod-meta">
              Denunciado em ${esc(date)}
            </div>

            <div class="almora-mod-meta">
              Denunciante:
              <a href="#perfil/${report.reporter_id}"
                style="color:var(--ac)">
                ${esc(reporterName)}
              </a>
            </div>

            <div class="almora-mod-meta">
              Motivo: <b>${esc(reasonName(report.reason))}</b>
            </div>

            ${report.details ? `
              <div class="almora-mod-meta">
                Detalhes da denúncia:
              </div>
              <div class="almora-mod-body">
                ${esc(report.details)}
              </div>
            ` : ''}

            <div class="almora-mod-meta">
              Comentário denunciado:
            </div>

            <div class="almora-mod-body">
              ${comment
                ? esc(comment.body)
                : 'O comentário não está mais disponível.'}
            </div>

            ${comment ? `
              <div class="almora-mod-meta">
                Situação do comentário:
                ${esc(comment.status)}
              </div>
            ` : ''}

            ${pending ? `
              <div class="almora-mod-actions">
                ${comment ? `
                  <button class="d"
                    onclick="almoraModerateReport('${report.id}','remove')">
                    Remover comentário
                  </button>
                  <button class="g"
                    onclick="almoraModerateReport('${report.id}','keep')">
                    Manter comentário
                  </button>
                ` : ''}
                <button class="g"
                  onclick="almoraModerateReport('${report.id}','reject')">
                  Rejeitar denúncia
                </button>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');

    } catch (error) {
      console.error('Erro na central de moderação:', error);
      mount.innerHTML =
        '<div class="empty">Não foi possível carregar as denúncias: ' +
        esc(error.message) + '</div>';
    }
  };

  window.almoraModerateReport = async function(reportId, action) {
    try {
      if (!await verifyAdmin()) {
        return toast('Acesso restrito à administração.');
      }

      const messages = {
        remove: 'Remover o comentário e aprovar a denúncia?',
        keep: 'Manter o comentário e encerrar a denúncia?',
        reject: 'Rejeitar esta denúncia?'
      };

      if (!confirm(messages[action] || 'Confirmar ação?')) return;

      const { data: report, error: reportError } = await almoraDB
        .from('reports')
        .select('id,comment_id')
        .eq('id', reportId)
        .single();

      if (reportError) throw reportError;

      if (action === 'remove' && report.comment_id) {
        const { error } = await almoraDB
          .from('comments')
          .update({
            status: 'hidden',
            updated_at: new Date().toISOString()
          })
          .eq('id', report.comment_id);

        if (error) throw error;
      }

      const newStatus =
        action === 'reject' ? 'rejected' : 'resolved';

      const { error: updateError } = await almoraDB
        .from('reports')
        .update({ status: newStatus })
        .eq('id', reportId);

      if (updateError) throw updateError;

      toast(
        action === 'remove'
          ? 'Comentário removido da visualização pública.'
          : action === 'keep'
            ? 'Denúncia encerrada. Comentário mantido.'
            : 'Denúncia rejeitada.'
      );

      await window.almoraLoadReports();

    } catch (error) {
      console.error('Erro ao moderar denúncia:', error);
      toast('Erro na moderação: ' + error.message);
    }
  };

  const oldRender = window.ren;

  window.ren = function(...args) {
    oldRender.apply(this, args);

    if (location.hash.slice(1).split('/')[0] === 'studio' && unlocked) {
      setTimeout(() => {
        if (document.getElementById('almora-report-list')) {
          window.almoraLoadReports();
        }
      }, 250);
    }
  };
})();
</script>

<script>
(() => {
  let adminStatus = false;

  const originalNav = window.nav;
  const originalStudio = window.studio;

  // O Studio é acessado pelo menu da engrenagem, sem duplicação no cabeçalho.
  window.nav = function(route) {
    originalNav(route);
  };

  // Bloqueia acesso direto à rota Studio
  window.studio = function(...args) {
    if (!adminStatus) {
      return `
        <div class="box" style="max-width:380px;margin:30px auto">
          <h2>Acesso restrito</h2>
          <p>Esta área é exclusiva da administração da ALMORA.</p>
          <a href="#home"><button>Voltar ao início</button></a>
        </div>
      `;
    }

    return originalStudio.apply(this, args);
  };

  // Consulta a autorização diretamente no Supabase
  async function checkAdmin() {
  const previousAdminStatus = adminStatus;

  if (typeof user === 'undefined' || !user) {
    adminStatus = false;

    if (previousAdminStatus !== adminStatus &&
        (location.hash.slice(1).split('/')[0] === 'studio')) {
      window.ren();
    }

    return;
  }

  const { data, error } = await almoraDB.rpc('is_admin');

  adminStatus = !error && data === true;

  if (previousAdminStatus !== adminStatus &&
      (location.hash.slice(1).split('/')[0] === 'studio')) {
    window.ren();
  }
  }

  // Verifica ao iniciar e quando a autenticação mudar
  almoraDB.auth.onAuthStateChange(() => {
    setTimeout(checkAdmin, 0);
  });

  checkAdmin();
})();
</script>

    const hero = document.querySelector('#app .hero');
    if (!hero) return;

    document.querySelector('#almora-rating')?.remove();

    hero.insertAdjacentHTML('afterend', `
      <section class="almora-rating" id="almora-rating">
        <b>Avaliações da comunidade</b>
        <div class="almora-rating-info">Carregando avaliações...</div>
      </section>
    `);

    try {
      const {data: ratings, error} = await almoraDB
        .from('ratings')
        .select('score')
        .eq('work_id', workId);

      if (error) throw error;
      if (request !== currentRatingRequest) return;

      const scores = ratings || [];
      const total = scores.length;
      const average = total
        ? scores.reduce((sum, item) => sum + Number(item.score), 0) / total
        : 0;

      let myScore = 0;

      if (user) {
        const {data, error: ownError} = await almoraDB
          .from('ratings')
          .select('score')
          .eq('work_id', workId)
          .eq('user_id', user.id)
          .maybeSingle();

        if (ownError) throw ownError;
        myScore = Number(data?.score || 0);
      }

      if (request !== currentRatingRequest) return;

      renderRating(workId, average, total, myScore);

    } catch (error) {
      const section = document.querySelector('#almora-rating');
      if (section) {
        section.innerHTML = `
          <b>Avaliações da comunidade</b>
          <p class="almora-rating-info">
            Não foi possível carregar as avaliações:
            ${esc(error.message)}
          </p>
        `;
      }
    }
  }

  function renderRating(workId, average, total, myScore) {
    const section = document.querySelector('#almora-rating');
    if (!section) return;

    section.innerHTML = `
      <b>Avaliações da comunidade</b>

      <div class="almora-rating-average">
        ${average.toFixed(1)} ★
      </div>

      <div class="almora-rating-info">
        ${total} ${total === 1 ? 'avaliação' : 'avaliações'}
      </div>

      <div class="almora-rating-info" style="margin-top:14px">
        ${user
          ? (myScore
              ? 'Sua avaliação atual: ' + myScore + '/5'
              : 'Qual nota você daria para esta obra?')
          : 'Entre na sua conta para avaliar esta obra.'}
      </div>

      <div class="almora-rating-stars">
        ${[1,2,3,4,5].map(n => `
          <button
            type="button"
            class="${n <= myScore ? 'active' : ''}"
            aria-label="${n} estrelas"
            ${user ? `onclick="almoraRateWork('${workId}',${n})"` : ''}
          >★</button>
        `).join('')}
      </div>

      <div class="almora-rating-info">
        ${myScore
          ? 'Você pode alterar sua avaliação quando quiser.'
          : 'Sua avaliação ajuda outros leitores a descobrir histórias.'}
      </div>
    `;
  }

  window.almoraRateWork = async function(workId, score) {
    if (!user) {
      toast('Entre na sua conta para avaliar.');
      location.hash = '#conta';
      return;
    }

    if (score < 1 || score > 5) return;

    const section = document.querySelector('#almora-rating');
    if (section) {
      section.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    try {
      const {data: existing, error: searchError} = await almoraDB
        .from('ratings')
        .select('score')
        .eq('work_id', workId)
        .eq('user_id', user.id)
        .maybeSingle();

      if (searchError) throw searchError;

      let result;

      if (existing) {
        result = await almoraDB
          .from('ratings')
          .update({score:score})
          .eq('work_id', workId)
          .eq('user_id', user.id);
      } else {
        result = await almoraDB
          .from('ratings')
          .insert({
            work_id:workId,
            user_id:user.id,
            score:score
          });
      }

      if (result.error) throw result.error;

      toast('Avaliação salva com sucesso!');
      await loadWorkRating(workId);

    } catch (error) {
      toast('Erro ao salvar avaliação: ' + error.message);
      await loadWorkRating(workId);
    }
  };

  const originalRen = window.ren;

  window.ren = function(...args) {
    originalRen.apply(this, args);

    const [route, workId] = location.hash
      .slice(1)
      .split('/');

    if (route === 'obra' && workId) {
      setTimeout(() => {
        if (location.hash === '#obra/' + workId) {
          loadWorkRating(workId);
        }
      }, 250);
    } else {
      currentRatingRequest++;
      currentRatingWork = null;
    }
  };

  if (location.hash.startsWith('#obra/')) {
    const id = location.hash.slice(6).split('/')[0];
    setTimeout(() => loadWorkRating(id), 500);
  }
})();
</script>

  <script>

(() => {
  const cache = {};
  const pending = new Set();

  function hasBadgeAfter(element) {
    return element?.nextElementSibling
      ?.classList.contains('almora-staff-badges') || false;
  }

  async function applyBadges() {
    const app = document.getElementById('app');
    if (!app || !window.almoraLoadStaffBadges) return;

    const targets = [];

    // Nome no perfil
    const profileTitle = app.querySelector(
      '.almora-profile-info h1'
    );

    if (profileTitle && !hasBadgeAfter(profileTitle)) {
      const id = location.hash.slice(1).split('/')[1] || user?.id;

      if (id) {
        targets.push({
          id,
          element: profileTitle
        });
      }
    }

    // Nomes nos comentários
    app.querySelectorAll(
      '.almora-comment-author, .almora-chapter-comment-author'
    ).forEach(author => {
      if (author.querySelector('.almora-staff-badges')) return;

      const match = author.getAttribute('href')?.match(
        /^#perfil\/([0-9a-f-]{36})$/i
      );

      if (!match) return;

      const name = author.querySelector(
        'span:not(.almora-comment-avatar-fallback)'
      );

      if (!name || hasBadgeAfter(name)) return;

      targets.push({
        id: match[1],
        element: name
      });
    });

    const missing = [
      ...new Set(
        targets
          .map(item => item.id)
          .filter(id => !cache[id] && !pending.has(id))
      )
    ];

    if (missing.length) {
      missing.forEach(id => pending.add(id));

      try {
        const result = await window.almoraLoadStaffBadges(missing);

        missing.forEach(id => {
          cache[id] = result[id] || [];
        });
      } catch (error) {
        console.error(
          'ALMORA — Erro ao carregar selos:',
          error
        );
      } finally {
        missing.forEach(id => pending.delete(id));
      }
    }

    targets.forEach(item => {
      if (hasBadgeAfter(item.element)) return;

      const badges = cache[item.id] || [];

      if (badges.length) {
        item.element.insertAdjacentHTML(
          'afterend',
          window.almoraRenderStaffBadges(badges)
        );
      }
    });
  }

  let badgeTimer = null;
  const observer = new MutationObserver(() => {
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(applyBadges, 100);
  });

  function start() {
    const app = document.getElementById('app');
    if (!app) return;

    observer.observe(app, {
      childList: true,
      subtree: true
    });

    applyBadges();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  window.addEventListener('hashchange', () => {
    setTimeout(applyBadges, 300);
  });
})();
    
  </script>
  <style>
.almora-pinned-label {
  background: #f5e8c5;
  color: #795b18;
  padding: 7px 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: bold;
}
.almora-pin-button {
  cursor: pointer;
}
</style>

<script>
(() => {
  let checkedUserId = null;
  let cachedCanPin = false;
  let running = false;
  let pending = false;

  async function permission() {
    const current = typeof user !== 'undefined' ? user : null;

    if (!current?.id) {
      checkedUserId = null;
      cachedCanPin = false;
      return false;
    }

    if (checkedUserId === current.id) return cachedCanPin;

    const map = await window.almoraLoadStaffBadges([current.id]);

    checkedUserId = current.id;
    cachedCanPin = (map[current.id] || []).some(x =>
      ['owner', 'admin', 'moderator'].includes(x.key)
    );

    return cachedCanPin;
  }

  async function scan() {
    if (running) {
      pending = true;
      return;
    }

    running = true;

    try {
      const app = document.getElementById('app');
      if (!app) return;

      const articles = [...app.querySelectorAll('article[data-comment-id]')];

      articles.forEach(article => {
        const pinned = article.dataset.isPinned === 'true';
        const existing = article.querySelector('.almora-pinned-label');

        if (pinned && !existing) {
          const label = document.createElement('div');
          label.className = 'almora-pinned-label';
          label.textContent = '📌 Comentário fixado';
          article.prepend(label);
        } else if (!pinned && existing) {
          existing.remove();
        }
      });

      const allowed = await permission();

      if (!allowed) {
        app.querySelectorAll('.almora-pin-button').forEach(b => b.remove());
        return;
      }

      articles.forEach(article => {
        const actions = article.querySelector(
          '.almora-comment-actions, .almora-chapter-comment-actions'
        );

        if (!actions || actions.querySelector('.almora-pin-button')) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'g almora-pin-button';
        btn.textContent =
          article.dataset.isPinned === 'true' ? '📌 Desafixar' : '📌 Fixar';

        btn.addEventListener('click', () =>
          window.almoraToggleCommentPin(btn)
        );

        actions.appendChild(btn);
      });

    } catch (e) {
      console.error('ALMORA — Fixar comentários:', e);
    } finally {
      running = false;
      if (pending) {
        pending = false;
        scan();
      }
    }
  }

  window.almoraToggleCommentPin = async function(button) {
    const article = button.closest('article[data-comment-id]');
    if (!article) return;

    const isPinned = article.dataset.isPinned === 'true';

    button.disabled = true;

    try {
      const { error } = await almoraDB.rpc('almora_pin_comment', {
        p_comment_id: article.dataset.commentId,
        p_is_pinned: !isPinned
      });

      if (error) throw error;

      toast(isPinned ? 'Comentário desafixado.' : 'Comentário fixado!');
      location.reload();

    } catch (e) {
      toast(e.message || 'Não foi possível alterar o comentário.');
      button.disabled = false;
    }
  };

  function start() {
    const app = document.getElementById('app');
    if (!app) return;

    let scanTimer = null;
    new MutationObserver(() => {
      clearTimeout(scanTimer);
      scanTimer = setTimeout(scan, 100);
    }).observe(app, {
      childList: true,
      subtree: true
    });

    scan();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  almoraDB.auth.onAuthStateChange(() => {
    checkedUserId = null;
    cachedCanPin = false;
    scan();
  });
})();
</script>

<script id="almora-studio-statistics-enhancement">
(() => {
  const originalStudio = window.studio;
  if (typeof originalStudio !== 'function') return;

  window.studio = function(...args) {
    let html = originalStudio.apply(this, args);
    if (!html.includes('id="almora-studio-works"')) return html;
    html = html.replace(
      '</div>\n\n<section id="almora-studio-works">',
      '<button id="almora-tab-stats" class="g" type="button" onclick="almoraStudioTab(&#39;stats&#39;)">Estatísticas</button></div>\n\n<section id="almora-studio-works">'
    );
    return html + '\n<section class="almora-mod" id="almora-studio-statistics" style="display:none"><h2>Estatísticas da ALMORA</h2><p style="color:var(--mu)">Visão geral dos dados cadastrados na plataforma.</p><div id="almora-stats-content"><div class="empty">Carregando estatísticas...</div></div><button class="g" type="button" style="width:100%;margin-top:12px" onclick="almoraLoadStudioStats()">Atualizar estatísticas</button></section>';
  };

  const previousTab = window.almoraStudioTab;
  window.almoraStudioTab = function(tab) {
    if (tab !== 'stats') {
      const statsPanel = document.getElementById('almora-studio-statistics');
      if (statsPanel) statsPanel.style.display = 'none';
      return previousTab(tab);
    }
    const works = document.getElementById('almora-studio-works');
    const moderation = document.getElementById('almora-moderation');
    const stats = document.getElementById('almora-studio-statistics');
    const buttons = {
      works: document.getElementById('almora-tab-works'),
      mod: document.getElementById('almora-tab-mod'),
      stats: document.getElementById('almora-tab-stats')
    };
    if (!works || !moderation || !stats || !buttons.stats) return;
    works.style.display = 'none';
    moderation.style.display = 'none';
    stats.style.display = 'block';
    Object.entries(buttons).forEach(([key, button]) => {
      if (!button) return;
      button.classList.toggle('on', key === 'stats');
      button.classList.toggle('g', key !== 'stats');
    });
    window.almoraLoadStudioStats();
  };

  window.almoraLoadStudioStats = async function() {
    const mount = document.getElementById('almora-stats-content');
    if (!mount) return;
    mount.innerHTML = '<div class="empty">Carregando estatísticas...</div>';
    try {
      const { data: allowed, error: permissionError } = await almoraDB.rpc('is_admin');
      if (permissionError) throw permissionError;
      if (allowed !== true) throw new Error('Acesso restrito à administração.');
      const metrics = [
        ['Obras cadastradas', 'works'],
        ['Capítulos cadastrados', 'chapters'],
        ['Páginas cadastradas', 'pages'],
        ['Contas de leitores', 'profiles'],
        ['Comentários', 'comments'],
        ['Denúncias recebidas', 'reports']
      ];
      const results = await Promise.all(metrics.map(async ([label, table]) => {
        const { count, error } = await almoraDB.from(table).select('*', { count: 'exact', head: true });
        return { label, count, error };
      }));
      mount.innerHTML = '<div class="grid">' + results.map(item =>
        '<article class="box" style="margin:0"><div style="color:var(--mu);font-size:13px">' +
        esc(item.label) + '</div><strong style="display:block;font-size:28px;margin-top:5px">' +
        (item.error ? '—' : Number(item.count || 0).toLocaleString('pt-BR')) +
        '</strong>' + (item.error ? '<small style="color:var(--mu)">Contagem indisponível</small>' : '') +
        '</article>'
      ).join('') + '</div>';
    } catch (error) {
      mount.innerHTML = '<div class="empty">Não foi possível carregar as estatísticas: ' + esc(error.message) + '</div>';
    }
  };
})();
</script>

<script id="almora-institutional-pages">
(() => {
  const pages = {
    sobre: '<section class="box" style="max-width:760px;margin:24px auto"><h1>Sobre a ALMORA</h1><p>A ALMORA é um espaço de descoberta e leitura de histórias GL e BL. A proposta é reunir obras, facilitar novas descobertas e oferecer uma experiência de leitura organizada e acolhedora.</p><h2>O que você encontra por aqui</h2><ul><li>Catálogo de obras GL e BL com filtros por gênero, status, classificação e tags.</li><li>Páginas de obras com sinopse, autoria, capítulos e avaliações.</li><li>Leitor com acompanhamento de progresso e marcadores de páginas.</li><li>Biblioteca pessoal, lista de desejos, perfis e conquistas.</li><li>Comentários e ferramentas de denúncia e moderação.</li></ul><p style="color:var(--mu)">A ALMORA está em desenvolvimento contínuo. Recursos podem ser aprimorados, alterados ou ficar temporariamente indisponíveis.</p></section>',
    regras: '<section class="box" style="max-width:760px;margin:24px auto"><h1>Regras da comunidade</h1><p>Queremos que a ALMORA seja um espaço seguro para leitores e criadores. Ao participar, siga estas regras:</p><ol><li><b>Respeito:</b> não pratique assédio, ameaças, perseguição ou ataques pessoais.</li><li><b>Sem discriminação:</b> não publique racismo, LGBTfobia, misoginia, capacitismo ou discurso de ódio.</li><li><b>Privacidade:</b> não exponha dados pessoais seus ou de outras pessoas sem consentimento.</li><li><b>Sem spam:</b> evite publicidade repetitiva, golpes, links maliciosos e conteúdo fora de contexto.</li><li><b>Spoilers:</b> sinalize informações importantes sobre acontecimentos de capítulos e finais.</li><li><b>Direitos autorais:</b> publique apenas conteúdo próprio ou material que você tenha autorização para disponibilizar.</li><li><b>Classificação indicativa:</b> informe corretamente a faixa etária e respeite as restrições aplicáveis.</li><li><b>Denúncias:</b> use a ferramenta de denúncia com responsabilidade; denúncias abusivas também podem ser moderadas.</li></ol><p>A equipe poderá ocultar conteúdo que viole estas regras e analisar denúncias conforme a gravidade e o contexto.</p></section>',
    contato: '<section class="box" style="max-width:760px;margin:24px auto"><h1>Contato</h1><p>Para relatar problemas técnicos, enviar sugestões ou comunicar uma questão relacionada à comunidade, utilize o canal público do projeto no GitHub.</p><p><a href="https://github.com/btwangelo/Almora/issues/new" target="_blank" rel="noopener noreferrer" style="color:var(--ac);text-decoration:underline">Abrir uma solicitação para a equipe da ALMORA</a></p><p style="color:var(--mu)">Não publique senhas, códigos de autenticação, dados pessoais ou informações privadas em solicitações públicas.</p></section>',

    privacidade: '<section class="box" style="max-width:760px;margin:24px auto"><h1>Política de privacidade</h1><p>Esta página resume, em linguagem simples, como a ALMORA trata informações necessárias ao funcionamento da plataforma. A ALMORA está em desenvolvimento; esta política deve ser revisada antes de uso comercial ou expansão do serviço.</p><h2>Informações tratadas</h2><p>Ao criar uma conta ou usar recursos autenticados, podem ser tratados identificadores da conta, nome de usuário, nome de exibição, foto, biografia, data de nascimento se fornecida, obras favoritas, biblioteca, progresso de leitura, marcadores sincronizados, comentários, avaliações, denúncias e notificações.</p><h2>Finalidades</h2><p>Essas informações são usadas para autenticar contas, manter recursos pessoais, exibir perfis conforme as configurações de privacidade, organizar leituras, moderar a comunidade e manter a segurança do serviço.</p><h2>Armazenamento e fornecedores</h2><p>A infraestrutura de banco de dados, autenticação e armazenamento utiliza serviços do Supabase. Alguns dados de preferências e marcadores podem permanecer no armazenamento local do navegador. Serviços externos usados para hospedar o site, entregar imagens ou carregar bibliotecas também podem receber dados técnicos necessários à conexão.</p><h2>Visibilidade e controle</h2><p>Informações de perfil, biblioteca, histórico e lista de desejos podem ter controles de visibilidade próprios quando disponíveis. Não publique senhas, códigos de autenticação ou dados pessoais em comentários ou canais públicos. Você pode editar seu perfil e ajustar as opções de privacidade disponíveis na conta.</p><h2>Retenção e contato</h2><p>Os dados permanecem enquanto necessários ao funcionamento da conta e do serviço, salvo obrigações legais ou de segurança. Para solicitar acesso, correção ou exclusão, entre em contato pelo canal oficial do projeto. A exclusão de dados pode depender da remoção da conta e de cópias técnicas mantidas pelo fornecedor.</p><p><b>Importante:</b> esta página é uma declaração informativa inicial, não uma garantia de conformidade jurídica nem uma descrição de todos os registros técnicos dos fornecedores.</p></section>',
    termos: '<section class="box" style="max-width:760px;margin:24px auto"><h1>Termos de uso</h1><p>Ao acessar a ALMORA, você concorda em usar a plataforma de forma legal, respeitosa e compatível com estas condições. A plataforma está em desenvolvimento e alguns recursos podem mudar ou ficar indisponíveis.</p><h2>Contas</h2><p>Você é responsável pela segurança de suas credenciais e pelas atividades realizadas em sua conta. Forneça informações corretas e não tente acessar contas ou áreas administrativas de terceiros.</p><h2>Conteúdo publicado</h2><p>Publique apenas obras, imagens, traduções e materiais que sejam seus ou que você tenha autorização para disponibilizar. Você mantém os direitos que possui sobre seu conteúdo, mas concede à ALMORA a permissão técnica necessária para armazená-lo e exibi-lo dentro do serviço. Não envie material ilegal, conteúdo que viole direitos de terceiros ou conteúdo incompatível com a classificação indicativa.</p><h2>Convivência e moderação</h2><p>Assédio, discriminação, ameaças, spam, golpes, exposição de dados pessoais e violações de direitos autorais não são permitidos. A equipe poderá analisar denúncias, ocultar material e restringir contas quando necessário, considerando a gravidade e o contexto.</p><h2>Disponibilidade e responsabilidade</h2><p>A ALMORA é fornecida em desenvolvimento contínuo, sem garantia de disponibilidade ininterrupta ou ausência de falhas. Mantenha cópias próprias de conteúdos importantes. Nada nestes termos limita direitos que a legislação aplicável não permita limitar.</p><h2>Alterações e contato</h2><p>Estes termos podem ser atualizados quando o serviço mudar. O uso continuado após a publicação de alterações representa ciência da versão atualizada, respeitados os direitos legais dos usuários. Dúvidas e solicitações podem ser enviadas pelo canal de contato da ALMORA.</p></section>'
  };

  const originalRender = window.ren;
  if (typeof originalRender !== 'function') return;

  window.ren = function(...args) {
    const route = location.hash.slice(1).split('/')[0];
    if (!Object.prototype.hasOwnProperty.call(pages, route)) {
      return originalRender.apply(this, args);
    }
    window.nav(route);
    document.getElementById('app').innerHTML = pages[route];
    window.almoraUpdatePageMeta(route);
    const titles = {sobre:'Sobre a ALMORA',regras:'Regras da comunidade',contato:'Contato',privacidade:'Política de privacidade',termos:'Termos de uso'};
    document.title = titles[route] + ' — ALMORA';
    const descriptions = {
      sobre:'Conheça a ALMORA, espaço de descoberta e leitura de histórias GL e BL.',
      regras:'Conheça as regras de convivência e participação da comunidade ALMORA.',
      contato:'Entre em contato com a equipe da ALMORA pelo canal oficial do projeto.',
      privacidade:'Saiba quais informações a ALMORA trata e como gerenciar as opções de privacidade disponíveis.',
      termos:'Condições de uso, publicação de conteúdo e convivência na comunidade ALMORA.'
    };
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', descriptions[route]);
    almoraSetMeta('meta[property="og:title"]', 'content', document.title);
    almoraSetMeta('meta[property="og:description"]', 'content', descriptions[route]);
    almoraSetMeta('meta[name="twitter:title"]', 'content', document.title);
    almoraSetMeta('meta[name="twitter:description"]', 'content', descriptions[route]);
  };
})();
</script>

<script id="almora-social-and-notifications">
(() => {
  const getUser = () => (typeof user !== 'undefined' ? user : null);
  const safe = value => typeof esc === 'function' ? esc(value) : String(value ?? '');

  async function loadWorkFavoriteCount(workId) {
    const mount = document.getElementById('almora-work-like-count');
    if (!mount) return;
    try {
      const { count, error } = await almoraDB.from('work_favorite_counts')
        .select('work_id', { count: 'exact', head: true })
        .eq('work_id', workId);
      if (error) throw error;
      const { data } = await almoraDB.from('work_favorite_counts')
        .select('favorites_count').eq('work_id', workId).maybeSingle();
      mount.textContent = '♡ ' + Number(data?.favorites_count || 0).toLocaleString('pt-BR') + ' curtidas';
    } catch (error) {
      mount.textContent = '';
      console.warn('Contagem de curtidas indisponível:', error);
    }
  }
  window.almoraLoadWorkFavoriteCount = loadWorkFavoriteCount;

  let socialProfileRequest = 0;

  async function loadSocialProfile(profileId) {
    const mount = document.getElementById('almora-profile-social');
    if (!mount || mount.dataset.profileId !== profileId) return;
    const request = ++socialProfileRequest;
    const me = getUser();
    try {
      const [followers, following, relation] = await Promise.all([
        almoraDB.from('follows').select('follower_id', {count:'exact',head:true}).eq('following_id',profileId),
        almoraDB.from('follows').select('following_id', {count:'exact',head:true}).eq('follower_id',profileId),
        me && me.id !== profileId
          ? almoraDB.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',profileId).maybeSingle()
          : Promise.resolve({data:null,error:null})
      ]);
      if (followers.error) throw followers.error;
      if (following.error) throw following.error;
      if (relation.error) throw relation.error;
      if (request !== socialProfileRequest ||
          !mount.isConnected ||
          mount.dataset.profileId !== profileId) return;
      const isFollowing = !!relation.data;
      mount.innerHTML = '<div class="almora-social-counts">' +
        '<button type="button" class="almora-social-count-button" data-connections-kind="followers"><b>' +
        Number(followers.count || 0).toLocaleString('pt-BR') +
        '</b><span>seguidores</span></button>' +
        '<button type="button" class="almora-social-count-button" data-connections-kind="following"><b>' +
        Number(following.count || 0).toLocaleString('pt-BR') +
        '</b><span>seguindo</span></button></div>' +
        (me && me.id !== profileId
          ? '<button class="g" type="button" id="almora-follow-button">' +
            (isFollowing ? 'Deixar de seguir' : 'Seguir') + '</button>'
          : '');
      const followButton = mount.querySelector('#almora-follow-button');
      followButton?.addEventListener('click', () => {
        window.almoraToggleFollow(profileId);
      });
    } catch (error) {
      if (request !== socialProfileRequest ||
          !mount.isConnected ||
          mount.dataset.profileId !== profileId) return;
      mount.innerHTML = '<small style="color:var(--mu)">Informações sociais indisponíveis.</small>';
      console.warn('Erro ao carregar relações sociais:', error);
    }
  }
  window.almoraToggleFollow = async function(profileId) {
    const me = getUser();
    if (!me) return toast('Entre na sua conta para seguir leitores.');
    if (me.id === profileId) return;
    const button = document.getElementById('almora-follow-button');
    if (button) button.disabled = true;
    try {
      const {data:existing,error:readError} = await almoraDB.from('follows')
        .select('follower_id').eq('follower_id',me.id).eq('following_id',profileId).maybeSingle();
      if (readError) throw readError;
      const result = existing
        ? await almoraDB.from('follows').delete().eq('follower_id',me.id).eq('following_id',profileId)
        : await almoraDB.from('follows').insert({follower_id:me.id,following_id:profileId});
      if (result.error) throw result.error;
      await loadSocialProfile(profileId);
    } catch (error) {
      toast('Não foi possível atualizar quem você segue: ' + error.message);
      if (button) button.disabled = false;
    }
  };

  const announcementUrl = value => {
    try { const url=new URL(value); return ['http:','https:'].includes(url.protocol)?url.href:''; }
    catch (_) { return ''; }
  };

  window.almoraRefreshNotificationBadge = async function(){
    const link=document.querySelector('[data-notifications-link]');
    if(!link)return;
    try{
      const me=getUser();
      const publicCount=await almoraDB.from('announcements').select('id',{count:'exact',head:true}).eq('is_published',true);
      if(publicCount.error)throw publicCount.error;
      let total=Number(publicCount.count||0);
      if(me){
        const results=await Promise.all([
          almoraDB.from('announcement_reads').select('announcement_id').eq('user_id',me.id),
          almoraDB.from('chapter_notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).is('read_at',null),
          almoraDB.from('follow_notifications').select('id',{count:'exact',head:true}).eq('user_id',me.id).is('read_at',null)
        ]);
        results.forEach(r=>{if(r.error)throw r.error;});
        total=Math.max(0,total-(results[0].data||[]).length)+Number(results[1].count||0)+Number(results[2].count||0);
      }
      link.querySelector('.almora-notification-badge')?.remove();
      if(total){
        const badge=document.createElement('span');
        badge.className='almora-notification-badge';
        badge.textContent=total>99?'99+':String(total);
        badge.style.cssText='display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:#d93654;color:#fff;font-size:11px;font-weight:700;line-height:1';
        link.appendChild(badge);
      }
    }catch(error){console.warn('Contagem de notificações indisponível:',error);}
  };

  async function loadNotifications() {
    const app=document.getElementById('app');
    const me=getUser();
    app.innerHTML='<div class="empty">Carregando notificações...</div>';
    try{
      const results=await Promise.all([
        almoraDB.from('announcements').select('id,title,body,image_url,link_url,created_at,published_at').eq('is_published',true).order('published_at',{ascending:false}).limit(50),
        me?almoraDB.from('chapter_notifications').select('id,work_id,chapter_id,created_at,read_at').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50):Promise.resolve({data:[],error:null}),
        me?almoraDB.from('follow_notifications').select('id,follower_id,created_at,read_at').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50):Promise.resolve({data:[],error:null}),
        me?almoraDB.from('announcement_reads').select('announcement_id').eq('user_id',me.id):Promise.resolve({data:[],error:null})
      ]);
      results.forEach(r=>{if(r.error)throw r.error;});
      const announcements=results[0].data||[],chapters=results[1].data||[],follows=results[2].data||[];
      const readIds=new Set((results[3].data||[]).map(x=>x.announcement_id));
      const workIds=[...new Set(chapters.map(x=>x.work_id))],chapterIds=[...new Set(chapters.map(x=>x.chapter_id))],followerIds=[...new Set(follows.map(x=>x.follower_id))];
      const details=await Promise.all([
        workIds.length?almoraDB.from('works').select('id,title').in('id',workIds):Promise.resolve({data:[],error:null}),
        chapterIds.length?almoraDB.from('chapters').select('id,chapter_number,title,chapter_label,chapter_type').in('id',chapterIds):Promise.resolve({data:[],error:null}),
        followerIds.length?almoraDB.from('profiles').select('id,username,display_name').in('id',followerIds):Promise.resolve({data:[],error:null})
      ]);
      details.forEach(r=>{if(r.error)throw r.error;});
      const wm=Object.fromEntries((details[0].data||[]).map(x=>[x.id,x])),cm=Object.fromEntries((details[1].data||[]).map(x=>[x.id,x])),pm=Object.fromEntries((details[2].data||[]).map(x=>[x.id,x]));
      const combined=[
        ...announcements.map(x=>({...x,notificationType:'announcement'})),
        ...chapters.map(x=>({...x,notificationType:'chapter'})),
        ...follows.map(x=>({...x,notificationType:'follow'}))
      ].sort((a,b)=>new Date(b.published_at||b.created_at)-new Date(a.published_at||a.created_at)).slice(0,100);
      if(!combined.length){
        app.innerHTML='<h1>Notificações</h1><div class="empty">Você ainda não tem notificações.</div>';
        window.almoraRefreshNotificationBadge();return;
      }
      app.innerHTML='<h1>Notificações</h1>'+combined.map(item=>{
        if(item.notificationType==='announcement'){
          const read=readIds.has(item.id);
          const image=item.image_url?'<img src="'+safe(item.image_url)+'" alt="Imagem do anúncio" loading="lazy" style="display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin:10px 0">':'';
          const url=announcementUrl(item.link_url);
          const link=url?'<p><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer"><button class="g" type="button">Saiba mais</button></a></p>':'';
          const readButton=me&&!read?'<div class="act"><button class="g" type="button" onclick="almoraMarkNotificationRead(\''+item.id+'\',\'announcement\')">Marcar como lida</button></div>':'';
          return '<article class="box almora-public-announcement" style="margin:10px 0;opacity:'+(read?'0.78':'1')+'"><small style="color:var(--ac);font-weight:700;letter-spacing:.04em">AVISO DA ALMORA</small><h2 style="margin:7px 0">'+safe(item.title)+'</h2>'+image+'<div style="white-space:pre-wrap;line-height:1.6">'+safe(item.body)+'</div>'+link+'<small style="display:block;color:var(--mu);margin-top:12px">'+new Date(item.published_at||item.created_at).toLocaleString('pt-BR')+'</small>'+readButton+'</article>';
        }
        if(item.notificationType==='follow'){
          const p=pm[item.follower_id]||{},name=p.display_name||'Um leitor',handle=p.username?' (@'+safe(p.username)+')':'';
          return '<article class="box" style="margin:10px 0;opacity:'+(item.read_at?'0.72':'1')+'"><b>'+safe(name)+safe(handle)+'</b><p>começou a seguir seu perfil.</p><small style="color:var(--mu)">'+new Date(item.created_at).toLocaleString('pt-BR')+'</small><div class="act"><a href="#perfil/'+encodeURIComponent(item.follower_id)+'"><button class="g" type="button">Ver perfil</button></a>'+(item.read_at?'':'<button class="g" type="button" onclick="almoraMarkNotificationRead(\''+item.id+'\',\'follow\')">Marcar como lida</button>')+'</div></article>';
        }
        const w=wm[item.work_id]||{},c=cm[item.chapter_id]||{},label=c.chapter_label||(c.chapter_type==='extra'?'Extra':c.chapter_type==='special'?'Especial':'Capítulo '+c.chapter_number);
        return '<article class="box" style="margin:10px 0;opacity:'+(item.read_at?'0.72':'1')+'"><b>'+safe(w.title||'Nova publicação')+'</b><p>'+safe(label)+' foi publicado.</p><small style="color:var(--mu)">'+new Date(item.created_at).toLocaleString('pt-BR')+'</small><div class="act"><a href="#obra/'+item.work_id+'"><button class="g" type="button">Abrir obra</button></a>'+(item.read_at?'':'<button class="g" type="button" onclick="almoraMarkNotificationRead(\''+item.id+'\',\'chapter\')">Marcar como lida</button>')+'</div></article>';
      }).join('');
      window.almoraRefreshNotificationBadge();
    }catch(error){app.innerHTML='<div class="empty">Não foi possível carregar notificações: '+safe(error.message)+'</div>';}
  }

  window.almoraMarkNotificationRead=async function(id,type='chapter'){
    const me=getUser();if(!me)return;
    let result;
    if(type==='announcement')result=await almoraDB.from('announcement_reads').upsert({user_id:me.id,announcement_id:id},{onConflict:'user_id,announcement_id'});
    else result=await almoraDB.from(type==='follow'?'follow_notifications':'chapter_notifications').update({read_at:new Date().toISOString()}).eq('id',id).eq('user_id',me.id);
    if(result.error)return toast('Não foi possível atualizar a notificação.');
    await window.almoraRefreshNotificationBadge();loadNotifications();
  };

  window.almoraLoadStudioAnnouncements=async function(){
    const mount=document.getElementById('almora-studio-announcements');
    if(!mount||mount.dataset.loading==='1')return;
    mount.dataset.loading='1';
    const me=getUser();
    try{
      if(!me)throw new Error('Entre com uma conta administrativa.');
      const permission=await almoraDB.rpc('is_admin');
      if(permission.error)throw permission.error;
      if(permission.data!==true)throw new Error('Acesso restrito à administração.');
      const result=await almoraDB.from('announcements').select('id,title,body,image_url,link_url,is_published,created_at,published_at').order('created_at',{ascending:false}).limit(100);
      if(result.error)throw result.error;
      const rows=result.data||[];
      let list='';
      rows.forEach(row=>{
        list+='<article class="box" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>'+safe(row.title)+'</b><small style="color:var(--mu)">'+(row.is_published?'Publicado':'Rascunho')+' · '+new Date(row.published_at||row.created_at).toLocaleString('pt-BR')+'</small></div>';
        if(row.image_url)list+='<img src="'+safe(row.image_url)+'" alt="" loading="lazy" style="width:100%;max-height:160px;object-fit:contain;margin-top:8px;border-radius:8px">';
        list+='<p style="white-space:pre-wrap">'+safe(row.body.length>240?row.body.slice(0,240)+'…':row.body)+'</p><div class="act"><button class="g" type="button" data-announcement-edit="'+row.id+'">Editar</button><button class="g" type="button" data-announcement-delete="'+row.id+'">Excluir</button></div></article>';
      });
      mount.innerHTML='<h2>Anúncios públicos</h2><p style="color:var(--mu)">Publique comunicados para todos os leitores da ALMORA. Eles aparecem na central de notificações, inclusive para quem administra o site.</p>'+
        '<form id="almora-announcement-form" class="box" style="display:grid;gap:10px"><h3 id="almora-announcement-form-title" style="margin:0">Criar anúncio</h3>'+
        '<label for="almora-announcement-title">Título</label><input id="almora-announcement-title" maxlength="140" required placeholder="Ex.: Novidade chegando à ALMORA">'+
        '<label for="almora-announcement-body">Mensagem</label><textarea id="almora-announcement-body" maxlength="12000" rows="6" required placeholder="Escreva o comunicado para os leitores..."></textarea>'+
        '<label for="almora-announcement-image">Imagem (opcional)</label><input id="almora-announcement-image" type="file" accept="image/*"><div id="almora-announcement-image-preview"></div>'+
        '<label for="almora-announcement-link">Link (opcional)</label><input id="almora-announcement-link" type="url" placeholder="https://...">'+
        '<div class="act"><button type="submit">Publicar anúncio</button><button type="button" class="g" id="almora-announcement-cancel" hidden>Cancelar edição</button></div><small style="color:var(--mu)">Imagens de até 5 MB. A publicação ficará visível para todos imediatamente.</small></form>'+
        '<h3>Anúncios publicados</h3><div id="almora-announcement-list">'+(list||'<div class="empty">Nenhum anúncio publicado ainda.</div>')+'</div>';
      const form=mount.querySelector('#almora-announcement-form'),titleInput=mount.querySelector('#almora-announcement-title'),bodyInput=mount.querySelector('#almora-announcement-body'),imageInput=mount.querySelector('#almora-announcement-image'),linkInput=mount.querySelector('#almora-announcement-link'),preview=mount.querySelector('#almora-announcement-image-preview'),cancel=mount.querySelector('#almora-announcement-cancel');
      let editing=null,currentImage=null;
      const reset=()=>{editing=null;currentImage=null;form.reset();preview.innerHTML='';mount.querySelector('#almora-announcement-form-title').textContent='Criar anúncio';form.querySelector('button[type="submit"]').textContent='Publicar anúncio';cancel.hidden=true;};
      cancel.addEventListener('click',reset);
      mount.querySelectorAll('[data-announcement-edit]').forEach(button=>button.addEventListener('click',()=>{
        const row=rows.find(item=>item.id===button.dataset.announcementEdit);if(!row)return;
        editing=row.id;currentImage=row.image_url;titleInput.value=row.title;bodyInput.value=row.body;linkInput.value=row.link_url||'';
        preview.innerHTML=currentImage?'<img src="'+safe(currentImage)+'" alt="Imagem atual" style="max-width:100%;max-height:180px;border-radius:8px">':'';
        mount.querySelector('#almora-announcement-form-title').textContent='Editar anúncio';form.querySelector('button[type="submit"]').textContent='Salvar e publicar';cancel.hidden=false;form.scrollIntoView({behavior:'smooth',block:'start'});
      }));
      mount.querySelectorAll('[data-announcement-delete]').forEach(button=>button.addEventListener('click',async()=>{
        if(!confirm('Excluir este anúncio permanentemente?'))return;
        const deleted=await almoraDB.from('announcements').delete().eq('id',button.dataset.announcementDelete);
        if(deleted.error)return toast('Não foi possível excluir: '+deleted.error.message);
        toast('Anúncio excluído.');mount.dataset.loaded='0';mount.dataset.loading='0';await window.almoraLoadStudioAnnouncements();
      }));
      imageInput.addEventListener('change',()=>{
        const file=imageInput.files?.[0];if(!file){preview.innerHTML=currentImage?'<img src="'+safe(currentImage)+'" alt="Imagem atual" style="max-width:100%;max-height:180px;border-radius:8px">':'';return;}
        if(!file.type.startsWith('image/')||file.size>5*1024*1024){imageInput.value='';return toast('Escolha uma imagem de até 5 MB.');}
        preview.innerHTML='<img src="'+URL.createObjectURL(file)+'" alt="Prévia da imagem" style="max-width:100%;max-height:180px;border-radius:8px">';
      });
      form.addEventListener('submit',async event=>{
        event.preventDefault();const title=titleInput.value.trim(),body=bodyInput.value.trim(),link=linkInput.value.trim();
        if(!title||!body)return toast('Preencha o título e a mensagem.');
        if(link&&!announcementUrl(link))return toast('Informe um link válido começando com http:// ou https://.');
        const file=imageInput.files?.[0];if(file&&(!file.type.startsWith('image/')||file.size>5*1024*1024))return toast('Escolha uma imagem de até 5 MB.');
        const submit=form.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Publicando...';
        try{
          let imageUrl=currentImage;
          if(file){
            const extension=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
            const path='announcements/'+me.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+extension;
            const uploaded=await almoraDB.storage.from('work-covers').upload(path,file,{cacheControl:'3600',upsert:false});
            if(uploaded.error)throw uploaded.error;
            imageUrl=almoraDB.storage.from('work-covers').getPublicUrl(path).data.publicUrl;
          }
          const payload={title,body,image_url:imageUrl||null,link_url:link||null,is_published:true,published_at:new Date().toISOString(),updated_at:new Date().toISOString()};
          const saved=editing?await almoraDB.from('announcements').update(payload).eq('id',editing):await almoraDB.from('announcements').insert({...payload,created_by:me.id});
          if(saved.error)throw saved.error;
          toast(editing?'Anúncio atualizado!':'Anúncio publicado para todos!');
          await window.almoraRefreshNotificationBadge();if(location.hash==='#notificacoes')loadNotifications();
          mount.dataset.loaded='0';mount.dataset.loading='0';await window.almoraLoadStudioAnnouncements();
        }catch(error){toast('Não foi possível publicar: '+error.message);}
        finally{submit.disabled=false;submit.textContent=editing?'Salvar e publicar':'Publicar anúncio';}
      });
      mount.dataset.loaded='1';
    }catch(error){mount.innerHTML='<div class="empty">'+safe(error.message)+'</div>';mount.dataset.loaded='1';}
    finally{mount.dataset.loading='0';}
  };

  window.almoraRefreshNotificationBadge?.();

  const originalRen=window.ren;
  if(typeof originalRen==='function'){
    window.ren=function(...args){
      const route=location.hash.slice(1).split('/')[0];
      if(route==='notificacoes'){nav(route);loadNotifications();return;}
      return originalRen.apply(this,args);
    };
  }

  function scanProfile() {
    const app=document.getElementById('app');
    if(app?.dataset.almoraProfileLoading==='1')return;
    const route=location.hash.slice(1).split('/');
    if(route[0]!=='perfil')return;
    const profileId=route[1] || getUser()?.id;
    const profile=document.querySelector('.almora-profile-view');
    if(!profile || !profileId)return;
    const actions=profile.querySelector('.almora-profile-actions');
    if(!actions)return;
    let mount=document.getElementById('almora-profile-social');
    if(mount && mount.dataset.profileId===profileId)return;
    if(mount)mount.remove();
    mount=document.createElement('div');
    mount.id='almora-profile-social';
    mount.dataset.profileId=profileId;
    mount.style.cssText='display:grid;gap:12px;margin-top:12px';
    mount.addEventListener('click',event=>{
      const button=event.target.closest('[data-connections-kind]');
      if(!button || !mount.contains(button))return;
      event.preventDefault();
      window.almoraOpenConnectionsPage?.(profileId,button.dataset.connectionsKind);
    });
    actions.insertAdjacentElement('afterend',mount);
    loadSocialProfile(profileId);
  }
  window.almoraInitProfileSocial=scanProfile;
  const app=document.getElementById('app');
  if(app)new MutationObserver(scanProfile).observe(app,{childList:true});
  scanProfile();
  document.addEventListener('DOMContentLoaded',scanProfile);
})();
</script>


<script id="almora-bookmark-sync">
(() => {
  const currentUser=()=>typeof user!=='undefined'?user:null;
  window.almoraPersistBookmark=async function(workId,chapter,page,remove){
    const me=currentUser(); if(!me)return;
    try{
      const query=almoraDB.from('page_bookmarks').delete()
        .eq('user_id',me.id).eq('work_id',workId)
        .eq('chapter_number',String(chapter)).eq('page_number',Number(page)||0);
      if(remove){
        const {error}=await query;if(error)throw error;
      }else{
        const {error}=await almoraDB.from('page_bookmarks').upsert({
          user_id:me.id,work_id:workId,chapter_number:String(chapter),
          page_number:Number(page)||0
        },{onConflict:'user_id,work_id,chapter_number,page_number'});
        if(error)throw error;
      }
    }catch(error){console.warn('Não foi possível sincronizar o marcador:',error);toast('Marcador salvo neste aparelho, mas não sincronizado.');}
  };
  async function syncRemoteBookmarks(){
    const me=currentUser();if(!me)return;
    try{
      const {data,error}=await almoraDB.from('page_bookmarks')
        .select('work_id,chapter_number,page_number,created_at')
        .eq('user_id',me.id).order('created_at',{ascending:false});
      if(error)throw error;
      S.bookmarks=S.bookmarks||{};
      (data||[]).forEach(item=>{
        const key=[item.work_id,item.chapter_number,item.page_number].join(':');
        S.bookmarks[key]={work_id:item.work_id,chapter:String(item.chapter_number),page:Number(item.page_number),created_at:new Date(item.created_at).getTime()};
      });
      save();
      if(location.hash==='#biblioteca')ren();
    }catch(error){console.warn('Sincronização de marcadores indisponível:',error);}
  }
  const originalToggle=window.almoraToggleBookmark;
  if(typeof originalToggle==='function'){
    window.almoraToggleBookmark=function(id,chapter,page,button){
      const key=[id,chapter,page].join(':');
      const removing=!!(S.bookmarks&&S.bookmarks[key]);
      originalToggle(id,chapter,page,button);
      window.almoraPersistBookmark(id,chapter,page,removing);
    };
  }
  almoraDB.auth.onAuthStateChange((event,session)=>{
    if(session?.user)syncRemoteBookmarks();
  });
})();
</script>
