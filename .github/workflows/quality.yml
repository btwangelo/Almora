name: ALMORA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check standalone scripts
        run: |
          node --check social-profiles.js
          node --check studio-dashboard.js
          node --check studio-settings.js

      - name: Check inline scripts in index.html
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script\s*>", html, re.IGNORECASE)
          checked = 0

          for attrs, source in blocks:
              if re.search(r"\bsrc\s*=", attrs, re.IGNORECASE):
                  continue
              type_match = re.search(r"""\btype\s*=\s*["']([^"']+)["']""", attrs, re.IGNORECASE)
              if type_match and type_match.group(1).lower() not in ("text/javascript", "application/javascript", "module"):
                  continue
              if not source.strip():
                  continue

              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as temp:
                  temp.write(source)
                  temp_path = temp.name

              try:
                  result = subprocess.run(["node", "--check", temp_path], text=True, capture_output=True)
                  if result.returncode:
                      print(result.stderr)
                      sys.exit(result.returncode)
              finally:
                  os.unlink(temp_path)
              checked += 1

          if checked == 0:
              raise SystemExit("No inline JavaScript blocks were checked.")
          print(f"Validated {checked} inline JavaScript block(s).")
          PY
