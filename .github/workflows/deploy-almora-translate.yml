name: Deploy ALMORA Translate Worker

on:
  push:
    branches:
      - main
      - feature/almora-translate-foundation
    paths:
      - "workers/almora-translate/**"
      - ".github/workflows/deploy-almora-translate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almora-translate-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Translate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Worker syntax and regression tests
        run: |
          node --input-type=module --check < workers/almora-translate/src/index.js
          node --test workers/almora-translate/tests/*.test.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/almora-translate
          command: deploy
