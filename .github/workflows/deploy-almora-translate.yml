name: Deploy ALMORA Translate Worker

on:
  push:
    branches:
      - feature/almora-translate-foundation
    paths:
      - "workers/almora-translate/**"
      - ".github/workflows/deploy-almora-translate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almora-translate-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated Translate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/almora-translate/wrangler.toml
